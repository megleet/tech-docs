<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 2 560 300" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="560" height="310" fill="#ffffff"/>

  <!-- ===== Ownership lines ===== -->
  <g fill="none" stroke="#334155" stroke-width="2">
    <path d="M240 72 C 240 92, 130 90, 130 110"/>
    <path d="M320 72 C 320 92, 430 90, 430 110"/>
    <path d="M130 174 C 130 186, 80 182, 80 194"/>
    <path d="M130 174 C 130 186, 180 182, 180 194"/>
    <path d="M430 174 V 194"/>
  </g>

  <!-- ===== Boxes ===== -->
  <g filter="url(#sh)">
    <rect x="155" y="8" width="250" height="64" rx="14" fill="#04a3ff"/>
    <rect x="10"  y="110" width="240" height="64" rx="14" fill="#ee5fa6"/>
    <rect x="310" y="110" width="240" height="64" rx="14" fill="#ee5fa6"/>
    <circle cx="80"  cy="224" r="30" fill="#f6bc00"/>
    <circle cx="180" cy="224" r="30" fill="#f6bc00"/>
    <circle cx="430" cy="224" r="30" fill="#5ed83a"/>
  </g>

  <g fill="#ffffff" text-anchor="middle">
    <text x="280" y="36" font-size="20" font-weight="800">Deployment</text>
    <text x="280" y="58" font-size="13">nginx-deployment · replicas: 3</text>
    <text x="130" y="138" font-size="18" font-weight="700">ReplicaSet v1</text>
    <text x="130" y="159" font-size="12">image: nginx:1.26 · replicas: 2</text>
    <text x="430" y="138" font-size="18" font-weight="700">ReplicaSet v2</text>
    <text x="430" y="159" font-size="12">image: nginx:1.27 · replicas: 1</text>
    <text x="80"  y="230" font-size="15" font-weight="700">Pod</text>
    <text x="180" y="230" font-size="15" font-weight="700">Pod</text>
    <text x="430" y="230" font-size="15" font-weight="700">Pod</text>
  </g>

  <!-- ===== Rolling update captions ===== -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <text x="130" y="276" fill="#a77d00">舊版本：逐步減少到0</text>
    <text x="430" y="276" fill="#3a9a1f">新版本：逐步增加到3</text>
  </g>
  <text x="280" y="298" font-size="12" fill="#64748b" text-anchor="middle">rolling update進行到一半的狀態</text>
</svg>
