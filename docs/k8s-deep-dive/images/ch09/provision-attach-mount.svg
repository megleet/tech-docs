<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 708 82" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="pam-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect x="8" y="8" width="708" height="82" fill="#ffffff"/>

