<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 14 840 266" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
<marker id="lay-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6bb5"/></marker>
<marker id="lay-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e08a00"/></marker>
<filter id="lay-sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect y="0" width="840" height="290" fill="#ffffff"/>

<!-- layers -->
<g filter="url(#lay-sh)">
<rect x="20" y="20" width="500" height="56" rx="12" fill="#fde7f1" stroke="#de69a5" stroke-width="2"/>
<rect x="20" y="86" width="500" height="56" rx="12" fill="#e8f0fb" stroke="#2f6bb5" stroke-width="2"/>
<rect x="20" y="152" width="500" height="56" rx="12" fill="#eef2f6" stroke="#64748b" stroke-width="2"/>
<rect x="20" y="218" width="500" height="56" rx="12" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
</g>
<g font-size="19" font-weight="800">
<text x="44" y="55" fill="#9d2463">Application<tspan font-weight="600" fill="#64748b">（Pod / container）</tspan></text>
<text x="44" y="121" fill="#1a3f78">Orchestration<tspan font-weight="600" fill="#64748b">（Kubernetes）</tspan></text>
<text x="44" y="187" fill="#334155">Infrastructure<tspan font-weight="600" fill="#64748b">（VM、VPC、LB、Disk）</tspan></text>
<text x="44" y="253" fill="#8a4b00">IaC<tspan font-weight="600" fill="#64748b">（Terraform、OpenTofu）</tspan></text>
</g>

<!-- what each tool manages -->
<path d="M520 114 C 572 114, 572 48, 526 48" fill="none" stroke="#2f6bb5" stroke-width="2.2" marker-end="url(#lay-b)"/>
<path d="M520 246 C 572 246, 572 180, 526 180" fill="none" stroke="#e08a00" stroke-width="2.2" marker-end="url(#lay-o)"/>
<g font-weight="800">
<text x="582" y="76" font-size="15" fill="#1a3f78">runtime</text>
<text x="582" y="96" font-size="13" fill="#475569" font-weight="600">schedule / scale / self-healing</text>
<text x="582" y="208" font-size="15" fill="#8a4b00">provision</text>
<text x="582" y="228" font-size="13" fill="#475569" font-weight="600">建出Infrastructure這一層</text>
</g>
</svg>
