<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 16 900 318" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><filter id="cd-sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter></defs>
<rect y="0" width="900" height="350" fill="#ffffff"/>
<g filter="url(#cd-sh)" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2">
<rect x="20" y="20" width="410" height="310" rx="16"/>
<rect x="470" y="20" width="410" height="310" rx="16"/>
</g>
<g text-anchor="middle">
<text x="225" y="50" font-size="20" font-weight="800" fill="#334155">Cloud Foundry</text>
<text x="225" y="70" font-size="13" font-weight="600" fill="#64748b">只打包app</text>
<text x="675" y="50" font-size="20" font-weight="800" fill="#334155">Docker</text>
<text x="675" y="70" font-size="13" font-weight="600" fill="#64748b">打包app和它需要的一切</text>
</g>
<!-- package frames -->
<rect x="64" y="88" width="322" height="64" rx="12" fill="#fff4e0" stroke="#e08a00" stroke-width="3"/>
<rect x="514" y="88" width="322" height="208" rx="12" fill="#fff4e0" stroke="#e08a00" stroke-width="3"/>
<g fill="#e08a00">
<rect x="78" y="78" width="48" height="20" rx="10"/>
<rect x="528" y="78" width="60" height="20" rx="10"/>
</g>
<g text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">
<text x="102" y="92">pkg</text>
<text x="558" y="92">image</text>
</g>
<!-- Cloud Foundry layers -->
<rect x="80" y="104" width="290" height="40" rx="10" fill="#ffffff" stroke="#7c5cbf" stroke-width="2"/>
<g fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5">
<rect x="80" y="160" width="290" height="40" rx="10"/>
<rect x="80" y="206" width="290" height="40" rx="10"/>
<rect x="80" y="252" width="290" height="40" rx="10"/>
</g>
<g text-anchor="middle" font-size="16" font-weight="800">
<text x="225" y="130" fill="#5b3fa0">app</text>
<g fill="#94a3b8">
<text x="225" y="186">libs / deps</text>
<text x="225" y="232">config</text>
<text x="225" y="278">OS rootfs</text>
</g>
</g>
<text x="225" y="316" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">虛線的部分靠平台提供，每種語言、版本各配一套</text>
<!-- Docker layers -->
<g fill="#ffffff" stroke-width="2">
<rect x="530" y="104" width="290" height="40" rx="10" stroke="#7c5cbf"/>
<rect x="530" y="150" width="290" height="40" rx="10" stroke="#0e9aa7"/>
<rect x="530" y="196" width="290" height="40" rx="10" stroke="#0e9aa7"/>
<rect x="530" y="242" width="290" height="40" rx="10" stroke="#64748b"/>
</g>
<g text-anchor="middle" font-size="16" font-weight="800">
<text x="675" y="130" fill="#5b3fa0">app</text>
<text x="675" y="176" fill="#0b4f56">libs / deps</text>
<text x="675" y="222" fill="#0b4f56">config</text>
<text x="675" y="268" fill="#334155">OS rootfs</text>
</g>
<text x="675" y="316" text-anchor="middle" font-size="13" font-weight="600" fill="#64748b">同一份image到處跑</text>
</svg>
