<text x="83" y="110" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">Informer Path</text>
<rect x="12" y="226" width="616" height="82" rx="12" fill="#eefaf5" stroke="#97d3bb" stroke-width="1.5" stroke-dasharray="6 5"/>
