<!-- scheduling -->
<rect x="230" y="240" width="80" height="36" rx="10" fill="#1f9d76"/>
<text x="270" y="263" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Filter</text>
<rect x="342" y="240" width="80" height="36" rx="10" fill="#1f9d76"/>
<text x="382" y="263" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Score</text>
<rect x="454" y="240" width="72" height="36" rx="10" fill="#1f9d76"/>
<text x="490" y="263" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">assume</text>
<circle cx="580" cy="258" r="22" fill="#1f9d76"/>
<text x="580" y="263" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">Bind</text>
</svg>
