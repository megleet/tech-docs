<marker id="sp-b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f6fd1"/></marker>
</defs>
<rect x="8" y="8" width="644" height="304" fill="#ffffff"/>

<!-- frames -->
