<text x="140" y="182" font-size="10.5" font-weight="600" fill="#64748b" text-anchor="end">activeQ・backoffQ</text>
<text x="140" y="195" font-size="10.5" font-weight="600" fill="#64748b" text-anchor="end">unschedulable</text>

