<text x="622" y="42" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">etcd</text>

<!-- Informer loop -->
<circle cx="320" cy="105" r="24" fill="#2f6fd1"/>
<text x="320" y="109" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">Informer</text>
<path d="M335.5 78.2 A 31 31 0 1 1 314.6 74.5" fill="none" stroke="#2f6fd1" stroke-width="3" marker-end="url(#sp-b)"/>

<!-- queue -->
<rect x="150" y="160" width="100" height="30" rx="3" fill="#2f6fd1"/>
<path d="M170 160 V 190 M190 160 V 190 M210 160 V 190 M230 160 V 190" stroke="#ffffff" stroke-width="2"/>
