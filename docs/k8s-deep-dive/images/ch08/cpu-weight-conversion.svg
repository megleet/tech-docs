<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 744 270" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
<marker id="cw-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6d4fc2"/></marker>
<marker id="cw-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d6457f"/></marker>
</defs>
<rect x="8" y="8" width="744" height="270" fill="#ffffff"/>

<!-- boxes -->
<rect x="12" y="16" width="160" height="58" rx="12" fill="#334155"/>
<text x="92" y="41" text-anchor="middle" font-size="14" font-weight="900" font-family="SFMono-Regular, Menlo, monospace" fill="#ffffff">requests.cpu</text>
<text x="92" y="61" text-anchor="middle" font-size="10.5" font-weight="600" fill="#dbe2ec">寫在Pod的YAML</text>

<rect x="296" y="16" width="160" height="58" rx="12" fill="#c99a00"/>
<text x="376" y="41" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">shares</text>
<text x="376" y="61" text-anchor="middle" font-size="10.5" font-weight="600" fill="#fff4d6">v1的約定：1 CPU = 1024</text>

<rect x="580" y="16" width="168" height="58" rx="12" fill="#1f9d76"/>
<text x="664" y="41" text-anchor="middle" font-size="14" font-weight="900" font-family="SFMono-Regular, Menlo, monospace" fill="#ffffff">cpu.weight</text>
<text x="664" y="61" text-anchor="middle" font-size="10.5" font-weight="600" fill="#d9f2e8">cgroup v2的檔案，1～10000</text>

<!-- arrows -->
<path d="M174 45 H 292" fill="none" stroke="#6d4fc2" stroke-width="2" marker-end="url(#cw-p)"/>
<text x="233" y="37" text-anchor="middle" font-size="12" font-weight="900" fill="#6d4fc2">① kubelet</text>
<text x="233" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">× 1024 ÷ 1000</text>

<path d="M458 45 H 576" fill="none" stroke="#d6457f" stroke-width="2" marker-end="url(#cw-k)"/>
<text x="517" y="37" text-anchor="middle" font-size="12" font-weight="900" fill="#d6457f">② runc</text>
<text x="517" y="62" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">非線性換算</text>

<!-- examples -->
<rect x="12" y="88" width="736" height="184" rx="12" fill="#f5f8fc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="24" y="107" font-size="11.5" font-weight="800" fill="#334155">例子</text>
<g font-size="14" font-weight="900" text-anchor="middle">
<text x="92" y="132" fill="#334155">沒寫</text><text x="376" y="132" fill="#a07a00">2</text><text x="664" y="132" fill="#1f9d76">1</text>
<text x="92" y="170" fill="#334155">250m</text><text x="376" y="170" fill="#a07a00">256</text><text x="664" y="170" fill="#1f9d76">35</text>
<text x="92" y="208" fill="#334155">500m</text><text x="376" y="208" fill="#a07a00">512</text><text x="664" y="208" fill="#1f9d76">59</text>
<text x="92" y="246" fill="#334155">1</text><text x="376" y="246" fill="#a07a00">1024</text><text x="664" y="246" fill="#1f9d76">100</text>
</g>
<g font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">
<text x="233" y="132">最小值</text><text x="517" y="132">→</text>
<text x="233" y="170">250 × 1024 ÷ 1000</text><text x="517" y="170">→</text>
<text x="233" y="208">500 × 1024 ÷ 1000</text><text x="517" y="208">→</text>
<text x="233" y="246">1000 × 1024 ÷ 1000</text><text x="517" y="246">→</text>
</g>
<g font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">
<text x="664" y="147">最低，幾乎搶不到CPU</text>
<text x="664" y="223">比250m多，但不到2倍</text>
<text x="664" y="261">= default，和系統service一樣</text>
</g>
</svg>
