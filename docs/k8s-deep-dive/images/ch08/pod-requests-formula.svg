<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 744 188" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<rect x="8" y="8" width="744" height="188" fill="#ffffff"/>

<!-- formula -->
<rect x="12" y="16" width="150" height="64" rx="12" fill="#334155"/>
<text x="87" y="44" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">Pod的requests</text>
<text x="87" y="64" text-anchor="middle" font-size="11" font-weight="600" fill="#dbe2ec">scheduler用的值</text>

<g font-size="22" font-weight="800" fill="#334155">
<text x="164" y="56">=</text>
<text x="184" y="56">max(</text>
<text x="392" y="56">+</text>
<text x="554" y="56">,</text>
<text x="734" y="56">)</text>
</g>

<rect x="246" y="16" width="140" height="64" rx="12" fill="#6d4fc2"/>
<text x="316" y="44" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">Σ 一般container</text>
<text x="316" y="64" text-anchor="middle" font-size="11" font-weight="600" fill="#e6defa">containers[]</text>

<rect x="414" y="16" width="134" height="64" rx="12" fill="#d6457f"/>
<text x="481" y="44" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">Σ sidecar</text>
<text x="481" y="64" text-anchor="middle" font-size="11" font-weight="600" fill="#fde2ec">restartPolicy: Always</text>

<rect x="570" y="16" width="160" height="64" rx="12" fill="#c99a00"/>
<text x="650" y="44" text-anchor="middle" font-size="14" font-weight="900" fill="#ffffff">最大的init container</text>
<text x="650" y="64" text-anchor="middle" font-size="11" font-weight="600" fill="#fff4d6">initContainers[]</text>

<!-- captions -->
<path d="M246 90 V 96 H 548 V 90" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<text x="397" y="112" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">一起跑：全部加起來</text>
<path d="M570 90 V 96 H 730 V 90" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<text x="650" y="112" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">依序跑：一次只跑一個</text>

<!-- example -->
<rect x="12" y="124" width="736" height="68" rx="12" fill="#f5f8fc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="24" y="143" font-size="11.5" font-weight="800" fill="#334155">例子：log-agent改寫成sidecar，再加一個要400m的init container</text>
<g font-size="16" font-weight="900" text-anchor="middle">
<text x="87" y="176" fill="#334155">400m</text>
<text x="316" y="176" fill="#6d4fc2">250m</text>
<text x="481" y="176" fill="#d6457f">50m</text>
<text x="650" y="176" fill="#a07a00">400m</text>
</g>
<g font-size="16" font-weight="800" fill="#334155">
<text x="164" y="176">=</text>
<text x="184" y="176">max(</text>
<text x="392" y="176">+</text>
<text x="554" y="176">,</text>
<text x="734" y="176">)</text>
</g>
<g font-size="10.5" font-weight="600" fill="#64748b" text-anchor="middle">
<text x="316" y="160">web</text>
<text x="481" y="160">log-agent</text>
<text x="650" y="160">init container</text>
</g>
</svg>
