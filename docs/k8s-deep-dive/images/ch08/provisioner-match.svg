<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 768 274" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="pm-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect x="8" y="8" width="768" height="274" fill="#ffffff"/>

<!-- API Server -->
<rect x="12" y="12" width="760" height="96" rx="14" fill="#f5f8fc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
<text x="24" y="32" font-size="12.5" font-weight="800" fill="#334155">API Server</text>
<rect x="28" y="42" width="300" height="56" rx="12" fill="#334155"/>
<text x="44" y="64" font-size="14" font-weight="900" fill="#ffffff">PVC</text>
<text x="44" y="84" font-size="11" font-family="SFMono-Regular, Menlo, monospace" fill="#e2e8f0">storageClassName: block-service</text>
<rect x="416" y="42" width="340" height="56" rx="12" fill="#2f6fd1"/>
<text x="432" y="64" font-size="14" font-weight="900" fill="#ffffff">StorageClass block-service</text>
<text x="432" y="84" font-size="11" font-family="SFMono-Regular, Menlo, monospace" fill="#dbe7fb">provisioner: <tspan font-weight="800" fill="#ffe08a">pd.csi.storage.gke.io</tspan></text>

<!-- Pod frames -->
<rect x="12" y="148" width="372" height="130" rx="14" fill="#fdf3e7" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="400" y="148" width="372" height="130" rx="14" fill="#fdf3e7" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="6 5"/>

<!-- lines -->
<g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#pm-a)">
<path d="M328 70 H 412"/>
<path d="M166 210 H 186"/>
<path d="M554 210 H 574"/>
</g>
<g fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#pm-a)">
<path d="M96 180 V 112"/>
<path d="M484 180 V 112"/>
</g>

<!-- Pod titles, drawn over the watch lines -->
<g paint-order="stroke" stroke="#fdf3e7" stroke-width="5" stroke-linejoin="round" font-size="12.5" font-weight="800" fill="#9a3412">
<text x="24" y="168">Persistent Disk的controller plugin Pod</text>
<text x="412" y="168">Filestore的controller plugin Pod</text>
</g>

<!-- Pod A -->
<rect x="26" y="180" width="140" height="60" rx="10" fill="#2f855a"/>
<text x="38" y="204" font-size="12" font-weight="900" fill="#ffffff">external-provisioner</text>
<text x="38" y="224" font-size="10" font-weight="600" fill="#e3f4ea">比對provisioner欄位</text>
<rect x="190" y="180" width="180" height="60" rx="10" fill="#d53f73"/>
<text x="202" y="204" font-size="13" font-weight="900" fill="#ffffff">CSI driver</text>
<text x="202" y="224" font-size="10" font-weight="800" font-family="SFMono-Regular, Menlo, monospace" fill="#ffe08a">pd.csi.storage.gke.io</text>
<text x="26" y="263" font-size="11" font-weight="800" fill="#475569">✔ 名字一樣：接手，建disk和PV</text>

<!-- Pod B -->
<rect x="414" y="180" width="140" height="60" rx="10" fill="#2f855a"/>
<text x="426" y="204" font-size="12" font-weight="900" fill="#ffffff">external-provisioner</text>
<text x="426" y="224" font-size="10" font-weight="600" fill="#e3f4ea">比對provisioner欄位</text>
<rect x="578" y="180" width="180" height="60" rx="10" fill="#d53f73"/>
<text x="590" y="204" font-size="13" font-weight="900" fill="#ffffff">CSI driver</text>
<text x="590" y="224" font-size="9.5" font-weight="700" font-family="SFMono-Regular, Menlo, monospace" fill="#fde2ea">filestore.csi.storage.gke.io</text>
<text x="414" y="263" font-size="11" font-weight="800" fill="#475569">✘ 名字不一樣：略過</text>

<!-- labels -->
<g paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" font-size="10.5" font-weight="800" fill="#475569">
<text x="370" y="64" text-anchor="middle">指向</text>
<text x="104" y="134">watch PVC、讀StorageClass</text>
<text x="492" y="134">watch PVC、讀StorageClass</text>
</g>
</svg>
