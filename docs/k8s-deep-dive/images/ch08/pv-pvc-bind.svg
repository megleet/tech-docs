<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 728 316" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="pb-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect width="760" height="350" fill="#ffffff"/>

<!-- condition frame -->
<rect x="292" y="128" width="176" height="104" rx="12" fill="#f5f8fc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="380" y="149" font-size="12.5" font-weight="800" fill="#334155" text-anchor="middle">① 檢查條件</text>
<g font-size="11" font-weight="600" fill="#475569" text-anchor="middle">
<text x="380" y="172">容量：1Gi ≤ 10Gi</text>
<text x="380" y="192">accessModes一樣</text>
<text x="380" y="212">storageClassName一樣</text>
</g>

<!-- lines -->
<g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#pb-a)">
<path d="M230 52 H 145 V 126"/>
<path d="M530 52 H 615 V 126"/>
<path d="M272 262 H 486"/>
<path d="M488 280 H 274"/>
</g>

<!-- PersistentVolumeController -->
<rect x="230" y="20" width="300" height="64" rx="12" fill="#6d4fc2"/>
<text x="380" y="46" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">PersistentVolumeController</text>
<text x="380" y="68" font-size="11.5" font-weight="600" fill="#ffe08a" text-anchor="middle">kube-controller-manager裡，不斷找還沒Bound的PVC</text>

<!-- PVC -->
<rect x="20" y="130" width="250" height="160" rx="12" fill="#0e9aa7"/>
<text x="36" y="156" font-size="16" font-weight="900" fill="#ffffff">PVC <tspan font-family="SFMono-Regular, Menlo, monospace" font-size="14">pv-claim</tspan></text>
<text x="36" y="175" font-size="11.5" font-weight="800" fill="#ffe08a">開發者寫：要什麼</text>
<g font-size="11.5" font-family="SFMono-Regular, Menlo, monospace" fill="#ffffff">
<text x="36" y="204">storage: 1Gi</text>
<text x="36" y="222">accessModes: [RWO]</text>
<text x="36" y="240">storageClassName: manual</text>
</g>
<rect x="30" y="252" width="200" height="24" rx="6" fill="#fff3c4"/>
<text x="36" y="268" font-size="11.5" font-weight="700" font-family="SFMono-Regular, Menlo, monospace" fill="#5b3a00">volumeName: pv-volume</text>

<!-- PV -->
<rect x="490" y="130" width="250" height="160" rx="12" fill="#e08a00"/>
<text x="506" y="156" font-size="16" font-weight="900" fill="#ffffff">PV <tspan font-family="SFMono-Regular, Menlo, monospace" font-size="14">pv-volume</tspan></text>
<text x="506" y="175" font-size="11.5" font-weight="800" fill="#fff3c4">管理cluster的人建：怎麼做到</text>
<g font-size="11.5" font-family="SFMono-Regular, Menlo, monospace" fill="#ffffff">
<text x="506" y="204">capacity: 10Gi</text>
<text x="506" y="222">accessModes: [RWO]</text>
<text x="506" y="240">storageClassName: manual</text>
</g>
<rect x="500" y="252" width="180" height="24" rx="6" fill="#fff3c4"/>
<text x="506" y="268" font-size="11.5" font-weight="700" font-family="SFMono-Regular, Menlo, monospace" fill="#5b3a00">claimRef: pv-claim</text>

<!-- labels on lines -->
<g paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" font-size="11" font-weight="800" fill="#475569">
<text x="162" y="44" text-anchor="middle">② 寫上volumeName</text>
<text x="588" y="44" text-anchor="middle">② 寫上claimRef</text>
<text x="380" y="255" text-anchor="middle">指向PV</text>
<text x="380" y="298" text-anchor="middle">指向PVC</text>
</g>

<text x="380" y="324" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="middle">kubelet mount時：Pod的claimName → PVC的volumeName → PV，就知道storage在哪裡</text>
</svg>
