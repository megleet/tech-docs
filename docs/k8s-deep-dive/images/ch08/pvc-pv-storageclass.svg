<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 598 248" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="ps-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect width="640" height="280" fill="#ffffff"/>

<!-- admin group -->
<rect x="346" y="96" width="264" height="132" rx="12" fill="#fffaf0" stroke="#e3b46b" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="360" y="115" font-size="12" font-weight="700" fill="#8a4b00">管理cluster的人事先設定</text>

<!-- lines -->
<path d="M120 64 V 100" fill="none" stroke="#475569" stroke-width="2"/>
<text x="130" y="87" font-size="12" font-weight="700" fill="#475569">volumes引用PVC</text>
<path d="M120 144 V 206" fill="none" stroke="#475569" stroke-width="3"/>
<text x="130" y="172" font-size="13" font-weight="800" fill="#334155">③ Bind</text>
<text x="130" y="190" font-size="11.5" font-weight="600" fill="#64748b">兩者都變成Bound</text>

<path d="M222 134 C 290 134, 330 146, 360 146" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ps-a)"/>
<g paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">
<text x="232" y="94" font-size="13" font-weight="800" fill="#334155">① Check</text>
<text x="232" y="110" font-size="11.5" font-weight="600" fill="#64748b">沒有合適的PV：</text>
<text x="232" y="125" font-size="11.5" font-weight="600" fill="#64748b">查storageClassName</text>
</g>

<path d="M440 218 C 430 246, 320 236, 226 230" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ps-a)"/>
<text x="250" y="258" font-size="13" font-weight="800" fill="#334155">② Provision<tspan font-size="11.5" font-weight="600" fill="#64748b">：自動建立PV</tspan></text>

<!-- boxes -->
<rect x="20" y="20" width="200" height="44" rx="10" fill="#2f6bb5"/>
<text x="120" y="47" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">Pod</text>

<rect x="20" y="100" width="200" height="44" rx="10" fill="#d9f4f6" stroke="#0e9aa7" stroke-width="2"/>
<text x="120" y="121" font-size="16" font-weight="800" fill="#0b4f56" text-anchor="middle">PVC</text>
<text x="120" y="137" font-size="11" font-weight="600" fill="#0b4f56" text-anchor="middle">開發者寫：要多大、怎麼存取</text>

<rect x="20" y="206" width="200" height="44" rx="10" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
<text x="120" y="227" font-size="16" font-weight="800" fill="#8a4b00" text-anchor="middle">PV</text>
<text x="120" y="243" font-size="11" font-weight="600" fill="#8a4b00" text-anchor="middle">storage的implementation</text>

<rect x="364" y="124" width="230" height="44" rx="10" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
<text x="479" y="145" font-size="15" font-weight="800" fill="#8a4b00" text-anchor="middle">StorageClass</text>
<text x="479" y="161" font-size="11" font-weight="600" fill="#8a4b00" text-anchor="middle">用哪個provisioner、什麼參數</text>
<rect x="364" y="174" width="230" height="44" rx="10" fill="#e08a00"/>
<text x="479" y="195" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Provisioner</text>
<text x="479" y="211" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">通常是CSI driver</text>
</svg>
