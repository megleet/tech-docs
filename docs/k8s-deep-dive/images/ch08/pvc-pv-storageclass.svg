<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 628 316" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="ps-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect width="660" height="350" fill="#ffffff"/>

<!-- admin group -->
<rect x="372" y="132" width="264" height="146" rx="12" fill="#fffaf0" stroke="#e3b46b" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="386" y="152" font-size="12" font-weight="700" fill="#8a4b00">管理cluster的人事先設定</text>

<!-- lines -->
<path d="M120 64 V 120" fill="none" stroke="#475569" stroke-width="2"/>
<text x="130" y="97" font-size="12" font-weight="700" fill="#475569">volumes引用PVC</text>
<path d="M120 164 V 266" fill="none" stroke="#475569" stroke-width="3"/>
<text x="130" y="210" font-size="13" font-weight="800" fill="#334155">③ Bind</text>
<text x="130" y="228" font-size="11.5" font-weight="600" fill="#64748b">兩者都變成Bound</text>

<path d="M222 142 C 320 142, 360 150, 386 176" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ps-a)"/>
<text x="250" y="126" font-size="13" font-weight="800" fill="#334155">① Check</text>
<text x="250" y="142" font-size="11.5" font-weight="600" fill="#64748b">沒有合適的PV：</text>
<text x="250" y="157" font-size="11.5" font-weight="600" fill="#64748b">查storageClassName</text>

<path d="M480 260 C 460 300, 330 296, 226 292" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ps-a)"/>
<text x="292" y="318" font-size="13" font-weight="800" fill="#334155">② Provision<tspan font-size="11.5" font-weight="600" fill="#64748b">：自動建立PV</tspan></text>

<!-- boxes -->
<rect x="20" y="20" width="200" height="44" rx="10" fill="#2f6bb5"/>
<text x="120" y="47" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">Pod</text>

<rect x="20" y="120" width="200" height="44" rx="10" fill="#d9f4f6" stroke="#0e9aa7" stroke-width="2"/>
<text x="120" y="141" font-size="16" font-weight="800" fill="#0b4f56" text-anchor="middle">PVC</text>
<text x="120" y="157" font-size="11" font-weight="600" fill="#0b4f56" text-anchor="middle">開發者寫：要多大、怎麼存取</text>

<rect x="20" y="270" width="200" height="44" rx="10" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
<text x="120" y="291" font-size="16" font-weight="800" fill="#8a4b00" text-anchor="middle">PV</text>
<text x="120" y="307" font-size="11" font-weight="600" fill="#8a4b00" text-anchor="middle">storage的實作</text>

<rect x="390" y="166" width="230" height="44" rx="10" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
<text x="505" y="187" font-size="15" font-weight="800" fill="#8a4b00" text-anchor="middle">StorageClass</text>
<text x="505" y="203" font-size="11" font-weight="600" fill="#8a4b00" text-anchor="middle">用哪個provisioner、什麼參數</text>
<rect x="390" y="216" width="230" height="44" rx="10" fill="#e08a00"/>
<text x="505" y="237" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Provisioner</text>
<text x="505" y="253" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">通常是CSI driver</text>
</svg>
