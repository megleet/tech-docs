<text x="180" y="358" font-size="12" font-weight="900" fill="#8a6100">CycleState<tspan font-size="10.5" font-weight="700">：這個Pod的暫存區，排完就清掉。PreFilter、PreScore寫進去，Filter、Score讀出來</tspan></text>
