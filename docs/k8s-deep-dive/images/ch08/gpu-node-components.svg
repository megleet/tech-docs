<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 6 396 230" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
  <style>.t{font-size:9.5px;font-weight:800}.d{font-size:7.5px;font-weight:600}</style>
  <marker id="gc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
</defs>
<rect x="6" y="6" width="396" height="230" fill="#ffffff"/>

<!-- Node: a server frame -->
<rect x="10" y="10" width="388" height="222" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
<path d="M10 26 V16 A6 6 0 0 1 16 10 H392 A6 6 0 0 1 398 16 V26 Z" fill="#334155"/>
<text x="20" y="21.5" font-size="9" font-weight="800" fill="#fff">gpu-node-a</text>
<circle cx="380" cy="18" r="2.3" fill="#4ade80"/>
<circle cx="389" cy="18" r="2.3" fill="#4ade80"/>

<!-- lines first -->
<g fill="none" stroke="#475569" stroke-width="2">
  <path d="M74 66 V93" marker-start="url(#gc-a)" marker-end="url(#gc-a)"/>
  <path d="M124 51 H147" marker-end="url(#gc-a)"/>
  <path d="M270 83 H291" marker-end="url(#gc-a)"/>
  <path d="M339 122 V149" marker-end="url(#gc-a)"/>
  <path d="M210 120 V149" stroke-dasharray="4 3" marker-end="url(#gc-a)"/>
  <path d="M142 179 V197" marker-end="url(#gc-a)"/>
</g>

<!-- kubelet (context, light) -->
<rect x="24" y="38" width="100" height="26" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="74" y="54.5" class="t" fill="#334155" text-anchor="middle">kubelet</text>

<!-- ① Device Plugin -->
<rect x="24" y="96" width="100" height="32" rx="7" fill="#0f766e"/>
<circle cx="36" cy="106.5" r="6" fill="#ffffff"/><text x="36" y="109.2" font-size="8" font-weight="800" fill="#0f766e" text-anchor="middle">1</text><text x="81" y="110" class="t" fill="#fff" text-anchor="middle">Device Plugin</text>
<text x="74" y="121" class="d" fill="#ccfbf1" text-anchor="middle">註冊、回報、分配GPU</text>

<!-- container runtime (context, light) with ③ NVIDIA Container Toolkit -->
<rect x="150" y="38" width="120" height="86" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="210" y="54.5" class="t" fill="#334155" text-anchor="middle">container runtime</text>
<text x="210" y="65" class="d" fill="#94a3b8" text-anchor="middle">例如containerd</text>
<rect x="158" y="72.0" width="104" height="44" rx="7" fill="#5b4fe9"/>
<circle cx="168" cy="82.5" r="6" fill="#ffffff"/><text x="168" y="85.2" font-size="8" font-weight="800" fill="#5b4fe9" text-anchor="middle">3</text><text x="217" y="86.0" class="t" fill="#fff" text-anchor="middle">NVIDIA Container</text>
<text x="217" y="97.0" class="t" fill="#fff" text-anchor="middle">Toolkit</text>
<text x="210" y="109.0" class="d" font-size="7" fill="#e9e6ff" text-anchor="middle" style="font-size:7px">把GPU、lib帶進container</text>

<!-- container (context, light) -->
<rect x="294" y="38" width="90" height="82" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="339" y="54.5" class="t" fill="#334155" text-anchor="middle">container</text>
<rect x="302" y="66" width="74" height="20" rx="4" fill="#b8336f"/>
<text x="339" y="79.5" font-size="8" font-weight="800" fill="#fff" text-anchor="middle">/dev/nvidia1</text>
<rect x="302" y="92" width="74" height="20" rx="4" fill="#e2e8f0"/>
<text x="339" y="105.5" font-size="8" font-weight="800" fill="#334155" text-anchor="middle">driver lib</text>

<!-- ② GPU driver: a host layer under everything -->
<rect x="24" y="152.0" width="360" height="24" rx="6" fill="#7e22ce"/>
<circle cx="38" cy="164.0" r="6" fill="#ffffff"/><text x="38" y="166.7" font-size="8" font-weight="800" fill="#7e22ce" text-anchor="middle">2</text><text x="50" y="167.5" class="t" fill="#fff">GPU driver</text>
<text x="110" y="167.5" class="d" fill="#e9d5ff">host上的驅動程式，沒有它GPU不能用</text>

<!-- GPU hardware -->
<text x="36" y="214.5" class="t" fill="#334155">GPU</text>
<g font-size="8" font-weight="800" fill="#fff" text-anchor="middle">
  <rect x="70" y="200.0" width="44" height="20" rx="4" fill="#94a3b8"/><text x="92" y="213.5">GPU0</text>
  <rect x="120" y="200.0" width="44" height="20" rx="4" fill="#b8336f"/><text x="142" y="213.5">GPU1</text>
  <rect x="170" y="200.0" width="44" height="20" rx="4" fill="#94a3b8"/><text x="192" y="213.5">GPU2</text>
  <rect x="220" y="200.0" width="44" height="20" rx="4" fill="#94a3b8"/><text x="242" y="213.5">GPU3</text>
</g>

<!-- arrow labels (explanations, light) -->
<g class="d" fill="#94a3b8" stroke="#f8fafc" stroke-width="3" paint-order="stroke">
  <text x="68" y="83" text-anchor="end">gRPC</text>
  <text x="135.5" y="46" text-anchor="middle">CRI</text>
  <text x="280.5" y="78" text-anchor="middle">建立</text>
</g>
<g stroke="#f8fafc" stroke-width="3" paint-order="stroke">
  <text x="333" y="137" class="t" fill="#0f172a" text-anchor="end">用GPU1</text>
  <text x="333" y="147" class="d" fill="#94a3b8" text-anchor="end">lib → /dev/nvidia1</text>
  <text x="204" y="137" class="t" fill="#0f172a" text-anchor="end">找driver lib</text>
  <text x="204" y="147" class="d" fill="#94a3b8" text-anchor="end">mount進container</text>
  <text x="136" y="192" class="t" fill="#0f172a" text-anchor="end">控制GPU1</text>
</g>
</svg>
