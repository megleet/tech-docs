<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 8 410 162" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="pr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker><linearGradient id="pr-user" gradientUnits="userSpaceOnUse" x1="0" y1="166" x2="0" y2="72"><stop offset="0" stop-color="#f6c443"/><stop offset="0.5" stop-color="#f2952c"/><stop offset="1" stop-color="#e8590c"/></linearGradient><linearGradient id="pr-arrow" gradientUnits="userSpaceOnUse" x1="0" y1="164" x2="0" y2="20"><stop offset="0" stop-color="#f6c443"/><stop offset="0.5" stop-color="#e8590c"/><stop offset="1" stop-color="#c0392b"/></linearGradient></defs>
<rect x="6" y="8" width="410" height="162" fill="#ffffff"/>

<!-- direction arrow -->
<path d="M22 164 V20" fill="none" stroke="url(#pr-arrow)" stroke-width="2" marker-end="url(#pr-a)"/>
<text transform="translate(36 92) rotate(-90)" font-size="10.5" font-weight="800" fill="#e8590c" text-anchor="middle">值越大，priority越高</text>

<!-- bar -->
<rect x="136" y="16" width="90" height="62" rx="6" fill="#c0392b"/>
<rect x="136" y="78" width="90" height="88" rx="6" fill="url(#pr-user)"/>
<rect x="136" y="72" width="90" height="12" fill="url(#pr-user)"/>
<rect x="136" y="72" width="90" height="6" fill="#c0392b"/>
<text x="181" y="44" font-size="10.5" font-weight="800" fill="#fff" text-anchor="middle">保留給</text>
<text x="181" y="58" font-size="10.5" font-weight="800" fill="#fff" text-anchor="middle">system Pod</text>
<text x="181" y="110" font-size="10.5" font-weight="800" fill="#fff" text-anchor="middle">user自訂</text>

<!-- ticks -->
<g stroke="#64748b" stroke-width="1.3">
<path d="M226 28 H234 M226 52 H234 M226 78 H234 M226 124 H234 M226 158 H234"/>
</g>
<g font-size="10" font-family="SFMono-Regular, Menlo, monospace" font-weight="600" fill="#334155" text-anchor="end">
<text x="128" y="31.5" fill="#c0392b">2,000,001,000</text>
<text x="128" y="55.5" fill="#c0392b">2,000,000,000</text>
<text x="128" y="81.5" font-weight="800" fill="#0f172a">1,000,000,000</text>
<text x="128" y="127.5" fill="#ea7a12">1,000,000</text>
<text x="128" y="161.5" fill="#b07d00">0</text>
</g>
<g font-size="10" font-weight="700" fill="#334155">
<text x="238" y="31.5" fill="#c0392b" font-family="SFMono-Regular, Menlo, monospace">system-node-critical</text>
<text x="238" y="55.5" fill="#c0392b" font-family="SFMono-Regular, Menlo, monospace">system-cluster-critical</text>
<text x="238" y="81.5" font-weight="800" fill="#0f172a">user的上限（10億）</text>
<text x="238" y="94" font-size="9.5" font-weight="600" fill="#94a3b8">user的Pod搶不走system Pod</text>
<text x="238" y="127.5" fill="#ea7a12" font-family="SFMono-Regular, Menlo, monospace">high-priority</text>
<text x="238" y="161.5" fill="#b07d00">沒指定PriorityClass（沒有default時）</text>
</g>
</svg>
