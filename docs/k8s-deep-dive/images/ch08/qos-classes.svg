<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 776 230" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="qc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d6457f"/></marker></defs>
<rect x="8" y="8" width="776" height="230" fill="#ffffff"/>

<!-- sacrifice order -->
<text x="14" y="31" font-size="12" font-weight="800" fill="#1f9d76">最後被犧牲</text>
<path d="M90 26 H 686" fill="none" stroke="#d6457f" stroke-width="2" marker-end="url(#qc-a)"/>
<text x="694" y="31" font-size="12" font-weight="800" fill="#d6457f">最先被犧牲</text>
<rect x="268" y="17" width="240" height="18" fill="#ffffff"/>
<text x="388" y="30" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b">Node資源不夠時：evict、OOM kill的順序</text>

<!-- Guaranteed -->
<rect x="12" y="44" width="248" height="190" rx="14" fill="#eef8f4" stroke="#a9dcc9" stroke-width="1.5"/>
<rect x="24" y="56" width="224" height="36" rx="10" fill="#1f9d76"/>
<text x="136" y="80" text-anchor="middle" font-size="15" font-weight="900" fill="#ffffff">Guaranteed</text>
<text x="24" y="112" font-size="11.5" font-weight="700" fill="#334155">每個container的CPU和mem</text>
<text x="24" y="128" font-size="11.5" font-weight="800" fill="#1f9d76">requests = limits</text>
<text x="24" y="152" font-size="10.5" font-weight="700" fill="#64748b">requests</text>
<rect x="84" y="143" width="120" height="12" rx="3" fill="#1f9d76"/>
<text x="24" y="172" font-size="10.5" font-weight="700" fill="#64748b">limits</text>
<rect x="84" y="163" width="120" height="12" rx="3" fill="#7cc9ad"/>
<text x="24" y="200" font-size="11" font-weight="700" fill="#334155">oom_score_adj：<tspan font-weight="900">-997</tspan></text>
<text x="24" y="220" font-size="11" font-weight="700" fill="#334155">保證拿得到，最後才被動到</text>

<!-- Burstable -->
<rect x="272" y="44" width="248" height="190" rx="14" fill="#fcf6e3" stroke="#e8d38f" stroke-width="1.5"/>
<rect x="284" y="56" width="224" height="36" rx="10" fill="#c99a00"/>
<text x="396" y="80" text-anchor="middle" font-size="15" font-weight="900" fill="#ffffff">Burstable</text>
<text x="284" y="112" font-size="11.5" font-weight="700" fill="#334155">不是Guaranteed，但</text>
<text x="284" y="128" font-size="11.5" font-weight="800" fill="#a07a00">至少設了一個requests或limits</text>
<text x="284" y="152" font-size="10.5" font-weight="700" fill="#64748b">requests</text>
<rect x="344" y="143" width="60" height="12" rx="3" fill="#c99a00"/>
<text x="284" y="172" font-size="10.5" font-weight="700" fill="#64748b">limits</text>
<rect x="344" y="163" width="120" height="12" rx="3" fill="#e3c766"/>
<text x="470" y="173" font-size="10" font-weight="700" fill="#a07a00">可以burst</text>
<text x="284" y="200" font-size="11" font-weight="700" fill="#334155">oom_score_adj：<tspan font-weight="900">2～999</tspan></text>
<text x="284" y="220" font-size="11" font-weight="700" fill="#334155">大多數Pod都在這一級</text>

<!-- BestEffort -->
<rect x="532" y="44" width="248" height="190" rx="14" fill="#fcf0f5" stroke="#efb8cd" stroke-width="1.5"/>
<rect x="544" y="56" width="224" height="36" rx="10" fill="#d6457f"/>
<text x="656" y="80" text-anchor="middle" font-size="15" font-weight="900" fill="#ffffff">BestEffort</text>
<text x="544" y="112" font-size="11.5" font-weight="700" fill="#334155">所有container</text>
<text x="544" y="128" font-size="11.5" font-weight="800" fill="#d6457f">都沒設requests和limits</text>
<text x="544" y="152" font-size="10.5" font-weight="700" fill="#64748b">requests</text>
<text x="604" y="153" font-size="10.5" font-weight="700" fill="#b8336a">沒寫（當成0）</text>
<text x="544" y="172" font-size="10.5" font-weight="700" fill="#64748b">limits</text>
<text x="604" y="173" font-size="10.5" font-weight="700" fill="#b8336a">沒寫（沒有上限）</text>
<text x="544" y="200" font-size="11" font-weight="700" fill="#334155">oom_score_adj：<tspan font-weight="900">1000</tspan></text>
<text x="544" y="220" font-size="11" font-weight="700" fill="#334155">沒有任何保證，最先被犧牲</text>
</svg>
