<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 6 754 502" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="am-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect width="770" height="520" fill="#ffffff"/>

<!-- frames: nodes (gray) -->
<rect x="10" y="10" width="280" height="204" rx="14" fill="#f5f8fc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
<text x="20" y="30" font-size="12.5" font-weight="800" fill="#334155">Master node（control plane）</text>
<rect x="302" y="10" width="444" height="204" rx="14" fill="#f5f8fc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
<text x="314" y="30" font-size="12.5" font-weight="800" fill="#334155">某一台Node（通常是worker node）</text>
<rect x="10" y="226" width="736" height="206" rx="14" fill="#f5f8fc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
<text x="20" y="246" font-size="12.5" font-weight="800" fill="#334155">Worker node <tspan fill="#c2410c" font-family="SFMono-Regular, Menlo, monospace">nodeA</tspan>（Pod所在的Node）</text>

<!-- frames: CSI pods (orange) -->
<rect x="312" y="38" width="424" height="166" rx="12" fill="#fcefe2" stroke="#a3360a" stroke-width="2" stroke-dasharray="6 5"/>
<text x="324" y="56" font-size="12.5" font-weight="800" fill="#a3360a">CSI controller plugin Pod（Deployment）</text>
<rect x="280" y="254" width="456" height="70" rx="12" fill="#fcefe2" stroke="#a3360a" stroke-width="2" stroke-dasharray="6 5"/>
<text x="292" y="272" font-size="12.5" font-weight="800" fill="#a3360a">node plugin Pod（DaemonSet）</text>

<!-- lines -->
<g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#am-a)">
<path d="M150 90 V 112"/>
<path d="M320 170 H 274"/>
<path d="M524 140 V 106"/>
<path d="M726 84 H 754 V 481 H 750"/>
<path d="M220 297 H 286"/>
<path d="M400 314 V 350"/>
<path d="M220 389 H 286"/>
<path d="M480 389 H 536"/>
<path d="M120 454 V 430"/>
</g>

<!-- kube-controller-manager -->
<rect x="20" y="38" width="260" height="52" rx="12" fill="#334155"/>
<text x="32" y="57" font-size="14" font-weight="900" fill="#ffffff">kube-controller-manager</text>
<rect x="30" y="63" width="240" height="20" rx="5" fill="#e2e8f0"/>
<text x="38" y="77" font-size="11" font-weight="800" fill="#1e293b">AttachDetachController<tspan font-weight="600" fill="#475569">：決定要不要attach</tspan></text>

<!-- API Server -->
<rect x="20" y="116" width="260" height="88" rx="12" fill="#475569"/>
<text x="32" y="137" font-size="15" font-weight="900" fill="#ffffff">API Server</text>
<rect x="30" y="146" width="240" height="50" rx="6" fill="#fff3c4"/>
<g font-size="11" font-family="SFMono-Regular, Menlo, monospace" fill="#5b3a00">
<text x="38" y="161" font-weight="800">VolumeAttachment</text>
<text x="38" y="175" font-weight="700">nodeName: <tspan fill="#c2410c">nodeA</tspan></text>
<text x="38" y="189">attached: false → true</text>
</g>

<!-- CSI driver (controller) -->
<rect x="322" y="64" width="404" height="40" rx="12" fill="#d6336c"/>
<text x="336" y="90" font-size="15" font-weight="900" fill="#ffffff">CSI driver</text>
<rect x="440" y="72" width="276" height="24" rx="6" fill="#fff3c4"/>
<text x="450" y="89" font-size="12" font-weight="800" fill="#7c4a03">Controller<tspan font-weight="600" fill="#9a6a2a">：呼叫storage API</tspan></text>

<!-- external-attacher -->
<rect x="322" y="142" width="404" height="54" rx="12" fill="#2f855a"/>
<text x="336" y="164" font-size="13.5" font-weight="900" fill="#ffffff">external-attacher<tspan font-size="10.5" font-weight="600" fill="#def7e8">（sidecar container）</tspan></text>
<text x="336" y="183" font-size="10.5" font-weight="600" fill="#ffe08a">watch VolumeAttachment，完成後寫回attached: true</text>

<!-- kubelet -->
<rect x="20" y="254" width="200" height="70" rx="12" fill="#3d5a80"/>
<text x="34" y="276" font-size="15" font-weight="900" fill="#ffffff">kubelet</text>
<text x="34" y="295" font-size="11" font-weight="700" fill="#e2e8f0">VolumeManager：</text>
<text x="34" y="311" font-size="10.5" font-weight="600" fill="#ffe08a">獨立的goroutine</text>

<!-- CSI driver (node) -->
<rect x="290" y="280" width="436" height="36" rx="12" fill="#d6336c"/>
<text x="304" y="303" font-size="15" font-weight="900" fill="#ffffff">CSI driver</text>
<rect x="408" y="286" width="308" height="24" rx="6" fill="#ece6fb"/>
<text x="418" y="303" font-size="12" font-weight="800" fill="#4c2f91">Node</text>

<!-- /dev/sdb -->
<rect x="20" y="354" width="200" height="70" rx="12" fill="#e08a00"/>
<text x="34" y="380" font-size="15" font-weight="900" fill="#ffffff" font-family="SFMono-Regular, Menlo, monospace">/dev/sdb</text>
<text x="34" y="398" font-size="10.5" font-weight="600" fill="#fff3c4">Node上多了一顆disk</text>
<text x="34" y="412" font-size="10.5" font-weight="600" fill="#fff3c4">像替VM加一顆disk</text>

<!-- volume dir -->
<rect x="290" y="354" width="190" height="70" rx="12" fill="#1f9d76"/>
<text x="304" y="379" font-size="15" font-weight="900" fill="#ffffff">volume目錄</text>
<g font-size="10" font-family="SFMono-Regular, Menlo, monospace" fill="#e3f7ef">
<text x="304" y="398">/var/lib/kubelet/pods/</text>
<text x="304" y="412">&lt;UID&gt;/volumes/…/&lt;volume名字&gt;</text>
</g>

<!-- container -->
<rect x="540" y="354" width="196" height="70" rx="12" fill="#334155"/>
<text x="554" y="375" font-size="15" font-weight="900" fill="#ffffff">container</text>
<rect x="550" y="382" width="116" height="18" rx="9.0" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/><text x="558" y="395" font-size="11.5" font-weight="800" fill="#ffffff">③ 建立container</text>
<rect x="550" y="402" width="174" height="18" rx="9.0" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/><text x="558" y="415" font-size="11.5" font-weight="800" fill="#ffffff">④ bind mount到mountPath</text>

<!-- step labels -->
<rect x="408" y="330" width="118" height="18" rx="9.0" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/><text x="416" y="343" font-size="11.5" font-weight="800" fill="#ffffff">② format + mount</text>
<rect x="128" y="434" width="170" height="18" rx="9.0" fill="#7c3aed" stroke="#ffffff" stroke-width="1.5"/><text x="136" y="447" font-size="11.5" font-weight="800" fill="#ffffff">① Attach：disk接到<tspan font-family="SFMono-Regular, Menlo, monospace">nodeA</tspan></text>

<!-- storage -->
<rect x="10" y="456" width="736" height="48" rx="12" fill="#2f6fd1"/>
<text x="26" y="477" font-size="15" font-weight="900" fill="#ffffff">Storage系統</text>
<text x="26" y="495" font-size="10.5" font-weight="600" fill="#ffe08a">Remote disk，例如cloud的disk、Ceph RBD</text>

<!-- labels on lines -->
<g paint-order="stroke" stroke="#f5f8fc" stroke-width="4" stroke-linejoin="round" font-size="11" font-weight="800" fill="#475569">
<text x="160" y="106">建立</text>
<text x="297" y="164" text-anchor="middle">watch</text>
<text x="253" y="291" text-anchor="middle">gRPC</text>

</g>
<g paint-order="stroke" stroke="#fcefe2" stroke-width="4" stroke-linejoin="round" font-size="11" font-weight="800" fill="#475569">
<text x="534" y="127">gRPC</text>
</g>
<g paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" font-size="11" font-weight="800" fill="#475569">

<text x="754" y="320" text-anchor="middle" dominant-baseline="central" transform="rotate(90 754 320)">呼叫storage API</text>
</g>
</svg>
