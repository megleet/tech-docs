  <g fill="none" stroke="#0e9aa7" stroke-width="3.5" stroke-dasharray="4 6" stroke-linecap="round">
    <path d="M590 230 V 100 H 854" marker-end="url(#a-grpc)" marker-start="url(#a-grpc)"/>
