  <!-- REST (protobuf) -->
  <g fill="none" stroke="#d1495b" stroke-width="3.5" stroke-dasharray="4 6" stroke-linecap="round">
    <path d="M390 282 H 479" marker-end="url(#a-rest)"/>
    <path d="M790 282 H 701" marker-end="url(#a-rest)"/>
    <path d="M567 328 V 414 H 261 V 472" marker-end="url(#a-rest)"/>
    <path d="M370 414 V 472" marker-end="url(#a-rest)"/>
    <path d="M610 328 V 388 H 741 V 668 M741 668 H 716 V 702 M741 668 H 766 V 702"/>
