    <line x1="60" y1="1046" x2="110" y2="1046" stroke="#0e9aa7" stroke-width="3.5" stroke-dasharray="4 6" stroke-linecap="round"/>
    <text x="120" y="1052">gRPC</text>
    <line x1="210" y1="1046" x2="260" y2="1046" stroke="#e0a800" stroke-width="4" stroke-dasharray="4 6" stroke-linecap="round"/>
