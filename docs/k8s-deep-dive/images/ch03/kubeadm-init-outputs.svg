<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="940" height="440" fill="#ffffff"/>

  <!-- ===== Connections ===== -->
  <g fill="none" stroke="#334155" stroke-width="2">
    <path d="M270 210 H 346" marker-end="url(#arr)"/>
    <path d="M530 210 H 570"/>
    <path d="M570 60 V 360"/>
    <path d="M570 60 H 616" marker-end="url(#arr)"/>
    <path d="M570 160 H 616" marker-end="url(#arr)"/>
    <path d="M570 260 H 616" marker-end="url(#arr)"/>
    <path d="M570 360 H 616" marker-end="url(#arr)"/>
  </g>
  <circle cx="570" cy="210" r="4" fill="#334155"/>
  <text x="310" y="198" font-size="16" font-weight="600" fill="#1e293b" text-anchor="middle">--config</text>

  <!-- ===== Boxes ===== -->
  <g filter="url(#sh)">
    <!-- left: user-provided kubeadm.yaml -->
    <rect x="30" y="80" width="240" height="260" rx="14" fill="#fde3c8" stroke="#ef8a2c" stroke-width="1.5" stroke-dasharray="5 4"/>
    <!-- middle: kubeadm init -->
    <rect x="350" y="170" width="180" height="80" rx="14" fill="#ef8a2c"/>
    <!-- right: files written by kubeadm -->
    <rect x="620" y="30"  width="290" height="60" rx="14" fill="#8b6fd6"/>
    <rect x="620" y="130" width="290" height="60" rx="14" fill="#8b6fd6"/>
    <rect x="620" y="230" width="290" height="60" rx="14" fill="#8b6fd6"/>
    <rect x="620" y="330" width="290" height="60" rx="14" fill="#8b6fd6"/>
  </g>

  <!-- left box content -->
  <g text-anchor="middle">
    <text x="150" y="128" font-size="22" font-weight="800" fill="#9a4a0b">kubeadm.yaml</text>
  </g>
  <g font-size="16" font-weight="600" fill="#7c3a06">
    <rect x="48" y="158" width="204" height="34" rx="8" fill="#ffffff" opacity="0.75"/>
    <text x="60" y="180">InitConfiguration</text>
    <rect x="48" y="200" width="204" height="34" rx="8" fill="#ffffff" opacity="0.75"/>
    <text x="60" y="222">ClusterConfiguration</text>
    <rect x="48" y="242" width="204" height="34" rx="8" fill="#ffffff" opacity="0.75"/>
    <text x="60" y="264">KubeletConfiguration</text>
    <rect x="48" y="284" width="204" height="34" rx="8" fill="#ffffff" opacity="0.75"/>
    <text x="60" y="306">KubeProxyConfiguration</text>
  </g>

  <!-- middle box content -->
  <g fill="#ffffff" text-anchor="middle" font-weight="800">
    <text x="440" y="219" font-size="24">kubeadm init</text>
  </g>

  <!-- right boxes content -->
  <g fill="#ffffff" text-anchor="middle" font-weight="600">
    <text x="765" y="55" font-size="18">/etc/kubernetes/pki</text>
    <text x="765" y="79" font-size="15">certificate</text>
    <text x="765" y="155" font-size="18">/etc/kubernetes/*.conf</text>
    <text x="765" y="179" font-size="15">各元件連API Server用的kubeconfig</text>
    <text x="765" y="255" font-size="18">/etc/kubernetes/manifests</text>
    <text x="765" y="279" font-size="15">control plane的Static Pod YAML</text>
    <text x="765" y="355" font-size="18">/var/lib/kubelet/config.yaml</text>
    <text x="765" y="379" font-size="15">kubelet的運行參數</text>
  </g>

  <!-- ===== Legend ===== -->
  <g font-size="16" fill="#334155">
    <rect x="30"  y="410" width="20" height="20" rx="5" fill="#fde3c8" stroke="#ef8a2c" stroke-dasharray="4 3"/><text x="58"  y="426">使用者提供的config file（選用）</text>
    <rect x="300" y="410" width="20" height="20" rx="5" fill="#ef8a2c"/><text x="328" y="426">kubeadm</text>
    <rect x="440" y="410" width="20" height="20" rx="5" fill="#8b6fd6"/><text x="468" y="426">kubeadm寫出的config file</text>
  </g>
</svg>
