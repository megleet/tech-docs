<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 820 260" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
<marker id="uc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
<filter id="uc-sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect y="0" width="820" height="270" fill="#ffffff"/>

<!-- Ubuntu image = car body -->
<g filter="url(#uc-sh)">
<rect x="250" y="14" width="320" height="100" rx="14" fill="#fff4e0" stroke="#e08a00" stroke-width="2.5"/>
</g>
<text x="410" y="40" font-size="17" font-weight="800" fill="#8a4b00" text-anchor="middle">Ubuntu image ＝ 車身</text>
<g font-size="13.5" font-weight="700" text-anchor="middle">
<rect x="270" y="52" width="130" height="30" rx="8" fill="#ffffff" stroke="#e08a00" stroke-width="1.5"/><text x="335" y="72" fill="#8a4b00">app</text>
<rect x="420" y="52" width="130" height="30" rx="8" fill="#ffffff" stroke="#e08a00" stroke-width="1.5"/><text x="485" y="72" fill="#8a4b00">lib（libc等）</text>
</g>
<text x="410" y="103" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="middle">只有User Space的檔案與lib，不包含kernel</text>

<!-- deploy arrows -->
<path d="M330 114 C 330 130, 225 126, 225 146" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#uc-a)"/>
<path d="M490 114 C 490 130, 595 126, 595 146" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#uc-a)"/>
<text x="250" y="130" font-size="12.5" font-weight="700" fill="#475569" text-anchor="end">deploy</text>
<text x="570" y="130" font-size="12.5" font-weight="700" fill="#475569">deploy</text>

<!-- ABI = engine interface -->
<rect x="60" y="150" width="700" height="32" rx="8" fill="#e3f4e8" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 4"/>
<text x="410" y="171" font-size="14" font-weight="800" fill="#1d5c43" text-anchor="middle">引擎接口：sys call ABI，所有Linux distro都相同</text>

<!-- kernels = engines -->
<g filter="url(#uc-sh)">
<rect x="60" y="192" width="330" height="70" rx="12" fill="#334155"/>
<rect x="430" y="192" width="330" height="70" rx="12" fill="#334155"/>
</g>
<g text-anchor="middle" font-weight="800" fill="#ffffff">
<text x="225" y="222" font-size="15"><tspan font-size="17" fill="#fbbf24">CentOS</tspan> host的Linux kernel</text>
<text x="225" y="244" font-size="12.5" font-weight="600" fill="#cbd5e1">引擎：版本、調校可以不同</text>
<text x="595" y="222" font-size="15"><tspan font-size="17" fill="#fbbf24">Debian</tspan> host的Linux kernel</text>
<text x="595" y="244" font-size="12.5" font-weight="600" fill="#cbd5e1">引擎：版本、調校可以不同</text>
</g>
</svg>
