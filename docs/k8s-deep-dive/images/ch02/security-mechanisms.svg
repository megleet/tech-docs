<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 808 250" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="840" height="282" fill="#ffffff"/>
<rect x="20" y="20" width="800" height="30" rx="7" fill="#f1f5f9"/>
<text x="34" y="40" font-size="12.5" font-weight="700" fill="#475569">機制</text>
<text x="214" y="40" font-size="12.5" font-weight="700" fill="#475569">🔍 檢查的是什麼</text>
<text x="434" y="40" font-size="12.5" font-weight="700" fill="#475569">📏 檢查範圍</text>
<text x="634" y="40" font-size="12.5" font-weight="700" fill="#475569">💡 比喻</text>
<rect x="20" y="57" width="4" height="46" rx="2" fill="#2f6bb5"/>
<rect x="34" y="68" width="129" height="24" rx="12" fill="#e8f0fb" stroke="#2f6bb5" stroke-width="1"/>
<text x="44" y="84.5" font-size="12.5" font-weight="800" fill="#1a3f78">🔑 Capabilities</text>
<text x="214" y="84.5" font-size="12.5" font-weight="500" fill="#334155">這個<tspan fill="#1a3f78" font-weight="800">process</tspan>有沒有<tspan fill="#1a3f78" font-weight="800">privilege</tspan></text>
<text x="434" y="76" font-size="12.5" font-weight="500" fill="#334155">只有需要privilege的操作</text>
<text x="434" y="93" font-size="12.5" font-weight="500" fill="#334155">才會被檢查</text>
<text x="634" y="84.5" font-size="12.5" font-weight="800" fill="#1e293b">🗝️ 發給你哪幾把key</text>
<line x1="20" y1="106" x2="820" y2="106" stroke="#e2e8f0"/>
<rect x="20" y="109" width="4" height="46" rx="2" fill="#e08a00"/>
<rect x="34" y="120" width="92" height="24" rx="12" fill="#fff4e0" stroke="#e08a00" stroke-width="1"/>
<text x="44" y="136.5" font-size="12.5" font-weight="800" fill="#8a4b00">🛡️ seccomp</text>
<text x="214" y="136.5" font-size="12.5" font-weight="500" fill="#334155">這個<tspan fill="#8a4b00" font-weight="800">sys call</tspan>能不能被呼叫</text>
<text x="434" y="128" font-size="12.5" font-weight="500" fill="#334155">不管需不需要privilege，</text>
<text x="434" y="145" font-size="12.5" font-weight="500" fill="#334155">所有sys call都能filter</text>
<text x="634" y="136.5" font-size="12.5" font-weight="800" fill="#1e293b">📞 能向kernel提出哪些請求</text>
<line x1="20" y1="158" x2="820" y2="158" stroke="#e2e8f0"/>
<rect x="20" y="161" width="4" height="46" rx="2" fill="#2e7d5b"/>
<rect x="34" y="172" width="173" height="24" rx="12" fill="#e3f4e8" stroke="#2e7d5b" stroke-width="1"/>
<text x="44" y="188.5" font-size="12.5" font-weight="800" fill="#1d5c43">🏠 AppArmor / SELinux</text>
<text x="214" y="180" font-size="12.5" font-weight="500" fill="#334155">這個<tspan fill="#1d5c43" font-weight="800">process</tspan>能不能<tspan fill="#1d5c43" font-weight="800">access</tspan></text>
<text x="214" y="197" font-size="12.5" font-weight="500" fill="#334155">這項resource（file、network等）</text>
<text x="434" y="180" font-size="12.5" font-weight="500" fill="#334155">依admin制定的policy檢查，</text>
<text x="434" y="197" font-size="12.5" font-weight="500" fill="#334155">root也要遵守</text>
<text x="634" y="188.5" font-size="12.5" font-weight="800" fill="#1e293b">🚪 能進入哪些room</text>
<line x1="20" y1="210" x2="820" y2="210" stroke="#e2e8f0"/>
<rect x="20" y="213" width="4" height="46" rx="2" fill="#7c5cbf"/>
<rect x="34" y="224" width="144" height="24" rx="12" fill="#f1ecfa" stroke="#7c5cbf" stroke-width="1"/>
<text x="44" y="240.5" font-size="12.5" font-weight="800" fill="#5b3fa0">👤 user namespace</text>
<text x="214" y="240.5" font-size="12.5" font-weight="500" fill="#334155">container裡的<tspan fill="#5b3fa0" font-weight="800">root</tspan>在host上是誰</text>
<text x="434" y="240.5" font-size="12.5" font-weight="500" fill="#334155">所有用到UID / GID的地方</text>
<text x="634" y="240.5" font-size="12.5" font-weight="800" fill="#1e293b">🪪 在host上換成普通身分</text>
</svg>
