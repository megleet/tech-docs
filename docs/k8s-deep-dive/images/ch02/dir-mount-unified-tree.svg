<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 20 898 276" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="930" height="310" fill="#ffffff"/>
<rect x="20" y="24" width="270" height="268" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="155" y="50" font-size="16" font-weight="800" fill="#334155" text-anchor="middle">Directory tree</text>
<text x="155" y="69" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="middle">filesystem實際存的內容，各自一棵</text>
<rect x="32" y="83" width="246" height="74" rx="8" fill="#e8f0fb"/>
<text x="40" y="98" font-size="12.5" font-weight="800" fill="#1a4fae" font-family="SFMono-Regular, Menlo, monospace" xml:space="preserve">Dir_A/</text>
<text x="40" y="116" font-size="12.5" font-weight="600" fill="#1a4fae" font-family="SFMono-Regular, Menlo, monospace" xml:space="preserve">├── fileA.txt</text>
<text x="40" y="134" font-size="12.5" font-weight="600" fill="#1a4fae" font-family="SFMono-Regular, Menlo, monospace" xml:space="preserve">├── dirB/<tspan font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">  空</tspan></text>
<text x="40" y="152" font-size="12.5" font-weight="600" fill="#1a4fae" font-family="SFMono-Regular, Menlo, monospace" xml:space="preserve">└── dirC_2/<tspan font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">  空</tspan></text>
<rect x="32" y="169" width="246" height="56" rx="8" fill="#d9f4f6"/>
<text x="40" y="184" font-size="12.5" font-weight="800" fill="#0b4f56" font-family="SFMono-Regular, Menlo, monospace" xml:space="preserve">Dir_B/</text>
<text x="40" y="202" font-size="12.5" font-weight="600" fill="#0b4f56" font-family="SFMono-Regular, Menlo, monospace" xml:space="preserve">├── fileB.txt</text>
<text x="40" y="220" font-size="12.5" font-weight="600" fill="#0b4f56" font-family="SFMono-Regular, Menlo, monospace" xml:space="preserve">└── dirC/<tspan font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">  空</tspan></text>
<rect x="32" y="237" width="246" height="38" rx="8" fill="#fff4e0"/>
<text x="40" y="252" font-size="12.5" font-weight="800" fill="#8a4b00" font-family="SFMono-Regular, Menlo, monospace" xml:space="preserve">Dir_C/</text>
<text x="40" y="270" font-size="12.5" font-weight="600" fill="#8a4b00" font-family="SFMono-Regular, Menlo, monospace" xml:space="preserve">└── fileC.txt</text>
<text x="310" y="166" font-size="28" font-weight="800" fill="#64748b" text-anchor="middle">+</text>
<text x="630" y="166" font-size="28" font-weight="800" fill="#64748b" text-anchor="middle">=</text>
<rect x="330" y="24" width="270" height="268" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="465" y="50" font-size="16" font-weight="800" fill="#334155" text-anchor="middle">Mount tree</text>
<text x="465" y="69" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="middle">kernel記錄的掛載關係，每個mount ns一棵</text>
<g stroke="#94a3b8" stroke-width="2" fill="none"><path d="M354 128 V159 H364"/><path d="M354 159 V259 H364"/><path d="M374 178 V209 H384"/></g>
<rect x="344" y="90" width="226" height="38" rx="8" fill="#e8f0fb" stroke="#2f6bb5" stroke-width="1.5"/>
<text x="354" y="106" font-size="12.5" font-weight="800" fill="#1a4fae">[Parent]</text>
<text x="354" y="121" font-size="11.5" font-weight="600" fill="#1a4fae" font-family="SFMono-Regular, Menlo, monospace">/mnt/root → Dir_A</text>
<rect x="364" y="140" width="206" height="38" rx="8" fill="#d9f4f6" stroke="#0e9aa7" stroke-width="1.5"/>
<text x="374" y="156" font-size="12.5" font-weight="800" fill="#0b4f56">[Child 1]</text>
<text x="374" y="171" font-size="11.5" font-weight="600" fill="#0b4f56" font-family="SFMono-Regular, Menlo, monospace">.../dirB → Dir_B</text>
<rect x="384" y="190" width="186" height="38" rx="8" fill="#fff4e0" stroke="#e08a00" stroke-width="1.5"/>
<text x="394" y="206" font-size="12.5" font-weight="800" fill="#8a4b00">[Grandchild]</text>
<text x="394" y="221" font-size="11.5" font-weight="600" fill="#8a4b00" font-family="SFMono-Regular, Menlo, monospace">.../dirB/dirC → Dir_C</text>
<rect x="364" y="240" width="206" height="38" rx="8" fill="#fff4e0" stroke="#e08a00" stroke-width="1.5"/>
<text x="374" y="256" font-size="12.5" font-weight="800" fill="#8a4b00">[Child 2]</text>
<text x="374" y="271" font-size="11.5" font-weight="600" fill="#8a4b00" font-family="SFMono-Regular, Menlo, monospace">.../dirC_2 → Dir_C</text>
<rect x="640" y="24" width="270" height="268" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="775" y="50" font-size="16" font-weight="800" fill="#334155" text-anchor="middle">Unified tree</text>
<text x="775" y="69" font-size="11.5" font-weight="600" fill="#64748b" text-anchor="middle">process看到的view</text>
<text x="660" y="100" font-size="12.5" font-weight="800" fill="#1a4fae" font-family="SFMono-Regular, Menlo, monospace" xml:space="preserve">/mnt/root/</text>
<text x="660" y="122" font-size="12.5" font-weight="600" fill="#1a4fae" font-family="SFMono-Regular, Menlo, monospace" xml:space="preserve">├── fileA.txt</text>
<text x="660" y="144" font-size="12.5" font-weight="800" fill="#0b4f56" font-family="SFMono-Regular, Menlo, monospace" xml:space="preserve">├── dirB/</text>
<text x="660" y="166" font-size="12.5" font-weight="600" fill="#0b4f56" font-family="SFMono-Regular, Menlo, monospace" xml:space="preserve">│   ├── fileB.txt</text>
<text x="660" y="188" font-size="12.5" font-weight="800" fill="#8a4b00" font-family="SFMono-Regular, Menlo, monospace" xml:space="preserve">│   └── dirC/</text>
<text x="660" y="210" font-size="12.5" font-weight="600" fill="#8a4b00" font-family="SFMono-Regular, Menlo, monospace" xml:space="preserve">│       └── fileC.txt</text>
<text x="660" y="232" font-size="12.5" font-weight="800" fill="#8a4b00" font-family="SFMono-Regular, Menlo, monospace" xml:space="preserve">└── dirC_2/</text>
<text x="660" y="254" font-size="12.5" font-weight="600" fill="#8a4b00" font-family="SFMono-Regular, Menlo, monospace" xml:space="preserve">    └── fileC.txt</text>
<text x="775" y="282" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">fileC.txt出現兩次，dir tree裡只有一份</text>
</svg>
