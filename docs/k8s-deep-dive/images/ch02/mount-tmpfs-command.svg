<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 12 900 252" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><filter id="mt-sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter></defs>
<rect y="0" width="900" height="270" fill="#ffffff"/>

<!-- command -->
<rect x="187" y="18" width="526" height="58" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-size="26" font-weight="700" font-family="SFMono-Regular, Menlo, monospace">
<text x="207.0" y="56" fill="#1a4fae" textLength="78.3" lengthAdjust="spacingAndGlyphs">mount</text>
<text x="301.0" y="56" fill="#b45309" textLength="125.3" lengthAdjust="spacingAndGlyphs">-t tmpfs</text>
<text x="441.9" y="56" fill="#5b3fa0" textLength="94.0" lengthAdjust="spacingAndGlyphs">layer1</text>
<text x="551.5" y="56" fill="#0b6e78" textLength="141.0" lengthAdjust="spacingAndGlyphs">/mnt/demo</text>
</g>

<!-- brackets + numbers -->
<path d="M303 84 V 90 H 424 V 84 M363.6 90 V 98" fill="none" stroke="#b45309" stroke-width="2"/>
<path d="M444 84 V 90 H 534 V 84 M488.9 90 V 98" fill="none" stroke="#5b3fa0" stroke-width="2"/>
<path d="M553 84 V 90 H 690 V 84 M622 90 V 98" fill="none" stroke="#0b6e78" stroke-width="2"/>
<g font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">
<circle cx="363.6" cy="111" r="12" fill="#b45309"/><text x="363.6" y="116">1</text>
<circle cx="488.9" cy="111" r="12" fill="#5b3fa0"/><text x="488.9" y="116">2</text>
<circle cx="622" cy="111" r="12" fill="#0b6e78"/><text x="622" y="116">3</text>
</g>

<!-- cards -->
<g filter="url(#mt-sh)" stroke-width="2">
<rect x="20" y="140" width="280" height="120" rx="12" fill="#fff4e0" stroke="#e08a00"/>
<rect x="310" y="140" width="290" height="120" rx="12" fill="#f1ecfa" stroke="#7c5cbf"/>
<rect x="610" y="140" width="270" height="120" rx="12" fill="#e3f6f4" stroke="#0e9aa7"/>
</g>
<g font-size="15" font-weight="800">
<text x="36" y="166" fill="#b45309">① <tspan font-family="SFMono-Regular, Menlo, monospace">-t tmpfs</tspan><tspan fill="#334155">：filesystem類型</tspan></text>
<text x="326" y="166" fill="#5b3fa0">② <tspan font-family="SFMono-Regular, Menlo, monospace">layer1</tspan><tspan fill="#334155">：source</tspan></text>
<text x="626" y="166" fill="#0b6e78">③ <tspan font-family="SFMono-Regular, Menlo, monospace">/mnt/demo</tspan><tspan fill="#334155">：mount point</tspan></text>
</g>
<g font-size="12.5" font-weight="600" fill="#334155">
<text x="36" y="194">tmpfs放在mem裡，不需要磁碟，</text>
<text x="36" y="214">卸載後內容就消失</text>
<text x="326" y="194">tmpfs沒有真正的裝置，這裡填什麼都可以，</text>
<text x="326" y="214">只是一個名字，會顯示在findmnt的</text>
<text x="326" y="234">SOURCE欄，方便分辨是哪一層</text>
</g>
</svg>
