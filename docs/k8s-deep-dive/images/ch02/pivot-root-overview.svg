<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 18 888 246" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="pr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect width="920" height="280" fill="#ffffff"/>
<g font-size="14" font-weight="800" fill="#334155" text-anchor="middle">
<text x="140" y="40">① 執行前</text>
<text x="460" y="40"><tspan font-family="SFMono-Regular, Menlo, monospace">② pivot_root</tspan>之後</text>
<text x="780" y="40"><tspan font-family="SFMono-Regular, Menlo, monospace">③ umount2</tspan>之後</text>
</g>

<!-- ① before -->
<rect x="20" y="52" width="240" height="208" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="34" y="76" font-size="14" font-weight="800" fill="#334155"><tspan font-family="SFMono-Regular, Menlo, monospace" font-size="16">/</tspan>　舊根（host）</text>
<g font-size="12" font-weight="700" fill="#334155" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">
<rect x="34" y="88" width="56" height="24" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="62" y="104">bin/</text>
<rect x="96" y="88" width="56" height="24" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="124" y="104">lib/</text>
<rect x="158" y="88" width="60" height="24" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="188" y="104">a.txt</text>
</g>
<rect x="34" y="124" width="212" height="122" rx="10" fill="#e3f4e8" stroke="#2e7d5b" stroke-width="2"/>
<text x="46" y="146" font-size="13" font-weight="800" fill="#1d5c43" font-family="SFMono-Regular, Menlo, monospace">new_root/</text>
<rect x="140" y="133" width="94" height="18" rx="9" fill="#2e7d5b"/><text x="187" y="146" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">mount point</text>
<g font-size="12" font-weight="700" fill="#1d5c43" font-family="SFMono-Regular, Menlo, monospace">
<rect x="46" y="160" width="60" height="24" rx="6" fill="#ffffff" stroke="#7fbf9a"/><text x="76" y="176" text-anchor="middle">app</text>
<rect x="46" y="196" width="100" height="24" rx="6" fill="#ffffff" stroke="#7fbf9a" stroke-dasharray="4 3"/><text x="96" y="212" text-anchor="middle">.old_root/</text>
</g>
<text x="154" y="212" font-size="11" font-weight="600" fill="#64748b">預先建好的空目錄</text>

<!-- arrow 1 -->
<line x1="264" y1="156" x2="334" y2="156" stroke="#475569" stroke-width="2.5" marker-end="url(#pr-a)"/>
<text x="299" y="146" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">pivot_root</text>

<!-- ② after pivot_root -->
<rect x="340" y="52" width="240" height="208" rx="12" fill="#e3f4e8" stroke="#2e7d5b" stroke-width="2"/>
<text x="354" y="76" font-size="14" font-weight="800" fill="#1d5c43"><tspan font-family="SFMono-Regular, Menlo, monospace" font-size="16">/</tspan>　新根（原本的new_root）</text>
<rect x="354" y="88" width="60" height="24" rx="6" fill="#ffffff" stroke="#7fbf9a"/><text x="384" y="104" font-size="12" font-weight="700" fill="#1d5c43" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">app</text>
<rect x="354" y="124" width="212" height="122" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="366" y="146" font-size="13" font-weight="800" fill="#334155" font-family="SFMono-Regular, Menlo, monospace">.old_root/</text>
<text x="456" y="146" font-size="11" font-weight="600" fill="#64748b">舊根整個移到這裡</text>
<g font-size="12" font-weight="700" fill="#334155" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">
<rect x="366" y="160" width="56" height="24" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="394" y="176">bin/</text>
<rect x="428" y="160" width="56" height="24" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="456" y="176">lib/</text>
<rect x="490" y="160" width="60" height="24" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="520" y="176">a.txt</text>
<rect x="366" y="196" width="90" height="24" rx="6" fill="#ffffff" stroke="#94a3b8"/><text x="411" y="212">new_root/</text>
</g>

<!-- arrow 2 -->
<line x1="584" y1="156" x2="654" y2="156" stroke="#475569" stroke-width="2.5" marker-end="url(#pr-a)"/>
<text x="619" y="146" font-size="11.5" font-weight="800" fill="#475569" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">umount2</text>

<!-- ③ after umount2 -->
<rect x="660" y="52" width="240" height="208" rx="12" fill="#e3f4e8" stroke="#2e7d5b" stroke-width="2"/>
<text x="674" y="76" font-size="14" font-weight="800" fill="#1d5c43"><tspan font-family="SFMono-Regular, Menlo, monospace" font-size="16">/</tspan>　新根</text>
<rect x="674" y="88" width="60" height="24" rx="6" fill="#ffffff" stroke="#7fbf9a"/><text x="704" y="104" font-size="12" font-weight="700" fill="#1d5c43" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">app</text>
<rect x="674" y="124" width="212" height="122" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="780" y="180" font-size="13" font-weight="800" fill="#64748b" text-anchor="middle">舊根已卸載</text>
<text x="780" y="202" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">看不到host的任何檔案</text>
</svg>
