<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 868 494" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><filter id="ms-sh" x="-5%" y="-10%" width="110%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.08"/></filter></defs>
<rect width="900" height="516" fill="#ffffff"/>
<line x1="40" y1="52.0" x2="40" y2="432.0" stroke="#cbd5e1" stroke-width="3"/>
<g filter="url(#ms-sh)"><rect x="72" y="20" width="808" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/></g>
<rect x="72" y="20" width="6" height="64" rx="3" fill="#7c5cbf"/>
<circle cx="40" cy="52.0" r="15" fill="#7c5cbf"/><text x="40" y="57.0" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
<rect x="92" y="39.0" width="96" height="26" rx="13" fill="#f1ecfa" stroke="#7c5cbf" stroke-width="1.5"/><text x="140" y="57.0" font-size="13" font-weight="800" fill="#5b3fa0" text-anchor="middle">Namespace</text>
<text x="204" y="47" font-size="14" font-weight="700" fill="#1f2937"><tspan font-family="SFMono-Regular, Menlo, monospace" font-size="13">clone(CLONE_NEWUSER|NEWPID|NEWNS|NEWNET|NEWIPC|NEWUTS|NEWCGROUP)</tspan></text>
<text x="204" y="69" font-size="12.5" font-weight="600" fill="#64748b">parent寫<tspan font-family="SFMono-Regular, Menlo, monospace">uid_map</tspan> / <tspan font-family="SFMono-Regular, Menlo, monospace">gid_map</tspan>；child <tspan font-family="SFMono-Regular, Menlo, monospace">sethostname</tspan></text>
<rect x="752" y="40.0" width="54" height="24" rx="12" fill="#f1f5f9" stroke="#94a3b8"/><text x="779" y="56.0" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">parent</text>
<rect x="810" y="40.0" width="54" height="24" rx="12" fill="#334155"/><text x="837" y="56.0" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">child</text>
<g filter="url(#ms-sh)"><rect x="72" y="96" width="808" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/></g>
<rect x="72" y="96" width="6" height="64" rx="3" fill="#e08a00"/>
<circle cx="40" cy="128.0" r="15" fill="#e08a00"/><text x="40" y="133.0" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
<rect x="92" y="115.0" width="96" height="26" rx="13" fill="#fff4e0" stroke="#e08a00" stroke-width="1.5"/><text x="140" y="133.0" font-size="13" font-weight="800" fill="#8a4b00" text-anchor="middle">cgroups</text>
<text x="204" y="123" font-size="14" font-weight="700" fill="#1f2937">建cgroup：<tspan font-family="SFMono-Regular, Menlo, monospace">/sys/fs/cgroup/&lt;container&gt;/memory.max</tspan>、<tspan font-family="SFMono-Regular, Menlo, monospace">cpu.max</tspan></text>
<text x="204" y="145" font-size="12.5" font-weight="600" fill="#64748b">把child的PID寫進<tspan font-family="SFMono-Regular, Menlo, monospace">cgroup.procs</tspan></text>
<rect x="810" y="116.0" width="54" height="24" rx="12" fill="#f1f5f9" stroke="#94a3b8"/><text x="837" y="132.0" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">parent</text>
<g filter="url(#ms-sh)"><rect x="72" y="172" width="808" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/></g>
<rect x="72" y="172" width="6" height="64" rx="3" fill="#0e9aa7"/>
<circle cx="40" cy="204.0" r="15" fill="#0e9aa7"/><text x="40" y="209.0" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
<rect x="92" y="191.0" width="96" height="26" rx="13" fill="#d9f4f6" stroke="#0e9aa7" stroke-width="1.5"/><text x="140" y="209.0" font-size="13" font-weight="800" fill="#0b4f56" text-anchor="middle">network</text>
<text x="204" y="199" font-size="14" font-weight="700" fill="#1f2937">建veth pair，一端移進child的netns，另一端接bridge</text>
<text x="204" y="221" font-size="12.5" font-weight="600" fill="#64748b">設IP / route</text>
<rect x="810" y="192.0" width="54" height="24" rx="12" fill="#f1f5f9" stroke="#94a3b8"/><text x="837" y="208.0" font-size="12" font-weight="800" fill="#475569" text-anchor="middle">parent</text>
<g filter="url(#ms-sh)"><rect x="72" y="248" width="808" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/></g>
<rect x="72" y="248" width="6" height="64" rx="3" fill="#2f6bb5"/>
<circle cx="40" cy="280.0" r="15" fill="#2f6bb5"/><text x="40" y="285.0" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
<rect x="92" y="267.0" width="96" height="26" rx="13" fill="#e8f0fb" stroke="#2f6bb5" stroke-width="1.5"/><text x="140" y="285.0" font-size="13" font-weight="800" fill="#1a3f78" text-anchor="middle">rootfs</text>
<text x="204" y="275" font-size="14" font-weight="700" fill="#1f2937">mount private → bind rootfs → 掛<tspan font-family="SFMono-Regular, Menlo, monospace">/proc</tspan>、<tspan font-family="SFMono-Regular, Menlo, monospace">/sys</tspan>、<tspan font-family="SFMono-Regular, Menlo, monospace">/dev</tspan></text>
<text x="204" y="297" font-size="12.5" font-weight="600" fill="#64748b">→ <tspan font-family="SFMono-Regular, Menlo, monospace">pivot_root</tspan> → <tspan font-family="SFMono-Regular, Menlo, monospace">umount2</tspan>舊根</text>
<rect x="810" y="268.0" width="54" height="24" rx="12" fill="#334155"/><text x="837" y="284.0" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">child</text>
<g filter="url(#ms-sh)"><rect x="72" y="324" width="808" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/></g>
<rect x="72" y="324" width="6" height="64" rx="3" fill="#2e7d5b"/>
<circle cx="40" cy="356.0" r="15" fill="#2e7d5b"/><text x="40" y="361.0" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
<rect x="92" y="343.0" width="96" height="26" rx="13" fill="#e3f4e8" stroke="#2e7d5b" stroke-width="1.5"/><text x="140" y="361.0" font-size="13" font-weight="800" fill="#1d5c43" text-anchor="middle">Security</text>
<text x="204" y="351" font-size="14" font-weight="700" fill="#1f2937">drop capabilities → set AppArmor / SELinux label → 載入seccomp</text>
<text x="204" y="373" font-size="12.5" font-weight="600" fill="#64748b">seccomp最後載入，緊接著<tspan font-family="SFMono-Regular, Menlo, monospace">execve</tspan></text>
<rect x="810" y="344.0" width="54" height="24" rx="12" fill="#334155"/><text x="837" y="360.0" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">child</text>
<g filter="url(#ms-sh)"><rect x="72" y="400" width="808" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/></g>
<rect x="72" y="400" width="6" height="64" rx="3" fill="#334155"/>
<circle cx="40" cy="432.0" r="15" fill="#334155"/><text x="40" y="437.0" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">6</text>
<rect x="92" y="419.0" width="96" height="26" rx="13" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="140" y="437.0" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">exec</text>
<text x="204" y="427" font-size="14" font-weight="700" fill="#1f2937"><tspan font-family="SFMono-Regular, Menlo, monospace">execve(entrypoint)</tspan></text>
<text x="204" y="449" font-size="12.5" font-weight="600" fill="#64748b">entrypoint成為container的PID 1，container開始執行</text>
<rect x="810" y="420.0" width="54" height="24" rx="12" fill="#334155"/><text x="837" y="436.0" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">child</text>
<g font-size="12.5" font-weight="700" fill="#64748b"><rect x="72" y="482" width="40" height="18" rx="9" fill="#f1f5f9" stroke="#94a3b8"/><text x="92" y="495" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">parent</text><text x="120" y="496">host上的runtime process</text><rect x="300" y="482" width="40" height="18" rx="9" fill="#334155"/><text x="320" y="495" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">child</text><text x="348" y="496">clone出來、之後變成container的process</text></g>
</svg>
