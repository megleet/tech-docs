<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 16 620 363" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="654" height="389" fill="#ffffff"/>
<line x1="34" y1="45.0" x2="34" y2="325.0" stroke="#cbd5e1" stroke-width="2.5"/>
<rect x="58" y="20" width="576" height="50" rx="9" fill="#f3f5f8"/>
<rect x="58" y="20" width="5" height="50" rx="2.5" fill="#7c5cbf"/>
<circle cx="34" cy="45" r="12" fill="#7c5cbf"/><text x="34" y="49.5" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
<rect x="72" y="34" width="84" height="22" rx="11" fill="#f1ecfa" stroke="#7c5cbf" stroke-width="1.5"/><text x="114" y="49" font-size="12" font-weight="800" fill="#5b3fa0" text-anchor="middle">Namespace</text>
<text x="170" y="41" font-size="13.5" font-weight="700" fill="#1f2937"><tspan font-family="SFMono-Regular, Menlo, monospace">clone(CLONE_NEW*)</tspan>：USER、PID、NS、NET、IPC、UTS、CGROUP</text>
<text x="170" y="59" font-size="12" font-weight="600" fill="#64748b">parent寫<tspan font-family="SFMono-Regular, Menlo, monospace">uid_map</tspan> / <tspan font-family="SFMono-Regular, Menlo, monospace">gid_map</tspan>；child <tspan font-family="SFMono-Regular, Menlo, monospace">sethostname</tspan></text>
<rect x="526" y="45" width="48" height="20" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><text x="550" y="59" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">parent</text>
<rect x="578" y="45" width="48" height="20" rx="10" fill="#334155"/><text x="602" y="59" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">child</text>
<rect x="58" y="76" width="576" height="50" rx="9" fill="#f3f5f8"/>
<rect x="58" y="76" width="5" height="50" rx="2.5" fill="#e08a00"/>
<circle cx="34" cy="101" r="12" fill="#e08a00"/><text x="34" y="105.5" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
<rect x="72" y="90" width="84" height="22" rx="11" fill="#fff4e0" stroke="#e08a00" stroke-width="1.5"/><text x="114" y="105" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="middle">cgroups</text>
<text x="170" y="97" font-size="13.5" font-weight="700" fill="#1f2937">建cgroup：<tspan font-family="SFMono-Regular, Menlo, monospace">/sys/fs/cgroup/&lt;container&gt;/</tspan></text>
<text x="170" y="115" font-size="12" font-weight="600" fill="#64748b">設<tspan font-family="SFMono-Regular, Menlo, monospace">memory.max</tspan>、<tspan font-family="SFMono-Regular, Menlo, monospace">cpu.max</tspan>，把child的PID寫進<tspan font-family="SFMono-Regular, Menlo, monospace">cgroup.procs</tspan></text>
<rect x="578" y="101" width="48" height="20" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><text x="602" y="115" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">parent</text>
<rect x="58" y="132" width="576" height="50" rx="9" fill="#f3f5f8"/>
<rect x="58" y="132" width="5" height="50" rx="2.5" fill="#0e9aa7"/>
<circle cx="34" cy="157" r="12" fill="#0e9aa7"/><text x="34" y="161.5" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
<rect x="72" y="146" width="84" height="22" rx="11" fill="#d9f4f6" stroke="#0e9aa7" stroke-width="1.5"/><text x="114" y="161" font-size="12" font-weight="800" fill="#0b4f56" text-anchor="middle">network</text>
<text x="170" y="153" font-size="13.5" font-weight="700" fill="#1f2937">建veth pair，一端移進child的netns</text>
<text x="170" y="171" font-size="12" font-weight="600" fill="#64748b">另一端接bridge，設IP / route</text>
<rect x="578" y="157" width="48" height="20" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><text x="602" y="171" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">parent</text>
<rect x="58" y="188" width="576" height="50" rx="9" fill="#f3f5f8"/>
<rect x="58" y="188" width="5" height="50" rx="2.5" fill="#2f6bb5"/>
<circle cx="34" cy="213" r="12" fill="#2f6bb5"/><text x="34" y="217.5" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
<rect x="72" y="202" width="84" height="22" rx="11" fill="#e8f0fb" stroke="#2f6bb5" stroke-width="1.5"/><text x="114" y="217" font-size="12" font-weight="800" fill="#1a3f78" text-anchor="middle">rootfs</text>
<text x="170" y="209" font-size="13.5" font-weight="700" fill="#1f2937">mount private → bind rootfs → 掛<tspan font-family="SFMono-Regular, Menlo, monospace">/proc</tspan>、<tspan font-family="SFMono-Regular, Menlo, monospace">/sys</tspan>、<tspan font-family="SFMono-Regular, Menlo, monospace">/dev</tspan></text>
<text x="170" y="227" font-size="12" font-weight="600" fill="#64748b">→ <tspan font-family="SFMono-Regular, Menlo, monospace">pivot_root</tspan> → <tspan font-family="SFMono-Regular, Menlo, monospace">umount2</tspan>舊根</text>
<rect x="578" y="213" width="48" height="20" rx="10" fill="#334155"/><text x="602" y="227" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">child</text>
<rect x="58" y="244" width="576" height="50" rx="9" fill="#f3f5f8"/>
<rect x="58" y="244" width="5" height="50" rx="2.5" fill="#2e7d5b"/>
<circle cx="34" cy="269" r="12" fill="#2e7d5b"/><text x="34" y="273.5" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
<rect x="72" y="258" width="84" height="22" rx="11" fill="#e3f4e8" stroke="#2e7d5b" stroke-width="1.5"/><text x="114" y="273" font-size="12" font-weight="800" fill="#1d5c43" text-anchor="middle">Security</text>
<text x="170" y="265" font-size="13.5" font-weight="700" fill="#1f2937">drop capabilities → AppArmor / SELinux → seccomp</text>
<text x="170" y="283" font-size="12" font-weight="600" fill="#64748b">seccomp最後載入，緊接著<tspan font-family="SFMono-Regular, Menlo, monospace">execve</tspan></text>
<rect x="578" y="269" width="48" height="20" rx="10" fill="#334155"/><text x="602" y="283" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">child</text>
<rect x="58" y="300" width="576" height="50" rx="9" fill="#f3f5f8"/>
<rect x="58" y="300" width="5" height="50" rx="2.5" fill="#334155"/>
<circle cx="34" cy="325" r="12" fill="#334155"/><text x="34" y="329.5" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">6</text>
<rect x="72" y="314" width="84" height="22" rx="11" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="114" y="329" font-size="12" font-weight="800" fill="#334155" text-anchor="middle">exec</text>
<text x="170" y="321" font-size="13.5" font-weight="700" fill="#1f2937"><tspan font-family="SFMono-Regular, Menlo, monospace">execve(entrypoint)</tspan></text>
<text x="170" y="339" font-size="12" font-weight="600" fill="#64748b">entrypoint成為PID 1，container開始執行</text>
<rect x="578" y="325" width="48" height="20" rx="10" fill="#334155"/><text x="602" y="339" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">child</text>
<g font-size="12" font-weight="700" fill="#64748b"><rect x="58" y="357" width="44" height="18" rx="9" fill="#f1f5f9" stroke="#94a3b8"/><text x="80" y="370" font-size="10.5" font-weight="800" fill="#475569" text-anchor="middle">parent</text><text x="110" y="371">host上的runtime process</text><rect x="288" y="357" width="44" height="18" rx="9" fill="#334155"/><text x="310" y="370" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">child</text><text x="340" y="371">clone出來、之後變成container的process</text></g>
</svg>
