<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 440 302" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
<marker id="xc-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d1495b"/></marker>
<filter id="xc-sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect y="0" width="440" height="320" fill="#ffffff"/>

<text x="220" y="32" font-size="17" font-weight="800" fill="#c62828" text-anchor="middle">✗ 放到不同CPU架構上</text>

<!-- x86_64 image -->
<g filter="url(#xc-sh)">
<rect x="40" y="50" width="360" height="64" rx="12" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
</g>
<text x="220" y="76" font-size="15" font-weight="800" fill="#8a4b00" text-anchor="middle"><tspan font-family="SFMono-Regular, Menlo, monospace" fill="#7c3aed">x86_64</tspan> image（在Intel / AMD上build）</text>
<text x="220" y="99" font-size="12.5" font-weight="700" fill="#8a4b00" text-anchor="middle">binary裡是x86的CPU instruction</text>

<!-- arrow with X -->
<path d="M220 118 V 196" fill="none" stroke="#d1495b" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#xc-r)"/>
<g stroke="#d1495b" stroke-width="4" stroke-linecap="round"><line x1="206" y1="144" x2="234" y2="172"/><line x1="234" y1="144" x2="206" y2="172"/></g>
<text x="246" y="152" font-size="12.5" font-weight="700" fill="#b3261e">ISA不同</text>
<text x="246" y="170" font-size="12.5" font-weight="700" fill="#b3261e">看不懂instruction</text>

<!-- arm64 CPU -->
<g filter="url(#xc-sh)">
<rect x="40" y="202" width="360" height="56" rx="12" fill="#334155"/>
</g>
<text x="220" y="225" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle"><tspan font-family="SFMono-Regular, Menlo, monospace" fill="#7dd3fc">arm64</tspan> CPU</text>
<text x="220" y="246" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">Apple Silicon、AWS Graviton</text>
<rect x="125" y="270" width="190" height="30" rx="8" fill="#fdecea"/>
<text x="220" y="290" font-size="13.5" font-weight="800" fill="#b3261e" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">exec format error</text>
</svg>
