<text x="375" y="142" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">UpdateFunc</text>
<text x="375" y="160" font-size="11" font-weight="600" fill="#fde2ee" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">c.enqueue(obj)</text>
