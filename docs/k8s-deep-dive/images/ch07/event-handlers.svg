<text x="375" y="222" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">DeleteFunc</text>
<text x="375" y="240" font-size="11" font-weight="600" fill="#fde2ee" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">c.enqueue(obj)</text>
