<text x="130" y="141" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">kubectl patch修改my-net</text>
<text x="130" y="159" font-size="11.5" font-weight="600" fill="#e9e3f8" text-anchor="middle">或resync定時trigger</text>
