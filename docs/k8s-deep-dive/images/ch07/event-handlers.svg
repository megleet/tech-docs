<text x="130" y="221" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">kubectl delete my-net</text>
<text x="130" y="239" font-size="11.5" font-weight="600" fill="#e9e3f8" text-anchor="middle">controller清理完、真的刪除時</text>
