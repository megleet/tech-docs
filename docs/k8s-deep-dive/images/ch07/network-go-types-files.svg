<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 14 880 290" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="900" height="320" fill="#ffffff"/>

<!-- frame -->
<rect x="16" y="20" width="868" height="214" rx="14" fill="#f5f8fc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
<text x="30" y="43" font-size="13" font-weight="800" fill="#334155" font-family="SFMono-Regular, Menlo, monospace">pkg/apis/example/v1/<tspan font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="600" fill="#64748b">（第3節自己寫的3個檔案）</tspan></text>

<!-- boxes -->
<rect x="30" y="56" width="270" height="164" rx="12" fill="#6d4fc2"/>
<rect x="314" y="56" width="272" height="164" rx="12" fill="#d6457f"/>
<rect x="600" y="56" width="270" height="164" rx="12" fill="#0284c7"/>

<!-- titles -->
<g font-size="18" font-weight="800" fill="#ffffff" font-family="SFMono-Regular, Menlo, monospace">
<text x="46" y="84">3.a doc.go</text>
<text x="330" y="84">3.b types.go</text>
<text x="616" y="84">3.c register.go</text>
</g>
<g font-size="14.5" font-weight="800" fill="#ffe08a">
<text x="46" y="108">整個pkg共用的tag</text>
<text x="330" y="108">Network長什麼樣子</text>
<text x="616" y="108">把型別登記進scheme</text>
</g>

<!-- contents -->
<g font-size="11" font-weight="600" font-family="SFMono-Regular, Menlo, monospace">
<g fill="#e9e3f8">
<text x="46" y="132">+groupName=example.com</text>
<text x="46" y="150">+k8s:deepcopy-gen=package</text>
</g>
<g fill="#fde2ee">
<text x="330" y="132">+genclient</text>
<text x="330" y="150">type Network struct</text>
<text x="344" y="168">TypeMeta、ObjectMeta</text>
<text x="344" y="186">Spec：Cidr、Gateway</text>
<text x="330" y="204">type NetworkList struct</text>
</g>
<g fill="#e0f2fe">
<text x="616" y="132">SchemeGroupVersion</text>
<text x="616" y="150">AddToScheme</text>
<text x="616" y="168">Resource()</text>
</g>
</g>
<g font-size="11" font-weight="600">
<text x="46" y="178" fill="#e9e3f8">group是example.com，</text>
<text x="46" y="195" fill="#e9e3f8">每個型別都要產生DeepCopy()</text>
<text x="616" y="195" fill="#e0f2fe">example.com/v1的Network</text>
<text x="616" y="211" fill="#e0f2fe">→ Go的Network struct</text>
</g>

<!-- who uses it -->
<g font-size="11.5" font-weight="700" text-anchor="middle">
<rect x="30" y="250" width="270" height="48" rx="10" fill="#fef08a"/>
<text x="165" y="270" fill="#4a3600">第4節code-generator讀這些tag</text>
<text x="165" y="288" fill="#6b5000" font-weight="600">決定group、要不要產生DeepCopy</text>
<rect x="314" y="250" width="272" height="48" rx="10" fill="#fef08a"/>
<text x="450" y="270" fill="#4a3600">code-generator讀+genclient</text>
<text x="450" y="288" fill="#6b5000" font-weight="600">controller用Network struct讀cidr、gateway</text>
<rect x="600" y="250" width="270" height="48" rx="10" fill="#fef08a"/>
<text x="735" y="270" fill="#4a3600">第4節產生的clientset用它</text>
<text x="735" y="288" fill="#6b5000" font-weight="600">把API Server回傳的JSON decode成struct</text>
</g>
<g fill="none" stroke="#c99a00" stroke-width="2">
<path d="M165 220 V 248"/><path d="M450 220 V 248"/><path d="M735 220 V 248"/>
</g>
</svg>
