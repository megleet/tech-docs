<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 868 238" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
<marker id="os-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
<marker id="os-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d1495b"/></marker>
</defs>
<rect width="900" height="270" fill="#ffffff"/>

<!-- lines -->
<g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#os-a)">
<path d="M170 122 H 236"/>
<path d="M430 122 H 496"/>
<path d="M650 122 C 686 122, 686 65, 716 65"/>
<path d="M650 122 C 686 122, 686 175, 716 175"/>
</g>
<path d="M335 164 V 240 H 800 V 214" fill="none" stroke="#d1495b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#os-r)"/>

<!-- labels -->
<g paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" font-weight="700">
<text x="203" y="112" font-size="12" fill="#475569" text-anchor="middle">watch</text>
<text x="463" y="112" font-size="12" fill="#475569" text-anchor="middle">建立、更新</text>
<text x="660" y="126" font-size="11.5" fill="#475569">建立Pod</text>
<text x="560" y="245" font-size="12.5" fill="#d1495b" text-anchor="middle">✕ 不直接管理Pod</text>
</g>

<!-- CR -->
<rect x="20" y="90" width="150" height="64" rx="10" fill="#d9f4f6" stroke="#0e9aa7" stroke-width="2"/>
<text x="95" y="117" font-size="15" font-weight="800" fill="#0b4f56" text-anchor="middle">Prometheus</text>
<text x="95" y="136" font-size="11" font-weight="600" fill="#0b4f56" text-anchor="middle">使用者寫的CR</text>

<!-- Operator -->
<rect x="240" y="80" width="190" height="84" rx="10" fill="#e08a00"/>
<text x="335" y="110" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Prometheus Operator</text>
<text x="335" y="130" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">控制循環＋維運邏輯</text>
<text x="335" y="146" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">config、升級、擴充…</text>

<!-- StatefulSet -->
<rect x="500" y="90" width="150" height="64" rx="10" fill="#2f6bb5"/>
<text x="575" y="117" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">StatefulSet</text>
<text x="575" y="136" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">固定名稱、storage</text>

<!-- Pods -->
<rect x="720" y="30" width="160" height="72" rx="10" fill="#eaf2fc" stroke="#2f6bb5" stroke-width="2"/>
<text x="800" y="51" font-size="13" font-weight="800" fill="#1a3f78" text-anchor="middle">Pod prometheus-0</text>
<rect x="740" y="62" width="120" height="28" rx="6" fill="#fff4e0" stroke="#e08a00" stroke-width="1.5"/>
<text x="800" y="80" font-size="11" font-weight="700" fill="#8a4b00" text-anchor="middle">PVC（自己的）</text>

<rect x="720" y="140" width="160" height="72" rx="10" fill="#eaf2fc" stroke="#2f6bb5" stroke-width="2"/>
<text x="800" y="161" font-size="13" font-weight="800" fill="#1a3f78" text-anchor="middle">Pod prometheus-1</text>
<rect x="740" y="172" width="120" height="28" rx="6" fill="#fff4e0" stroke="#e08a00" stroke-width="1.5"/>
<text x="800" y="190" font-size="11" font-weight="700" fill="#8a4b00" text-anchor="middle">PVC（自己的）</text>
</svg>
