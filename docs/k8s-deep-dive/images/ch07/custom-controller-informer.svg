<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 6 1000 448" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
<marker id="cc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
<marker id="cc-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d1495b"/></marker>
<marker id="cc-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e08a00"/></marker>
<filter id="cc-sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
</defs>
<rect y="0" width="1000" height="460" fill="#ffffff"/>

<!-- frames -->
<rect x="196" y="12" width="348" height="420" rx="14" fill="#f5f8fc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
<text x="212" y="38" font-size="15" font-weight="800" fill="#334155">Informer<tspan font-weight="600" fill="#64748b">（產生的程式碼）</tspan></text>
<rect x="580" y="12" width="408" height="420" rx="14" fill="#fbfaf6" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
<text x="596" y="38" font-size="15" font-weight="800" fill="#334155">Controller<tspan font-weight="600" fill="#64748b">（自己寫）</tspan></text>

<!-- connections -->
<g fill="none" stroke="#334155" stroke-width="2">
<path d="M150 200 H 176 V 99 H 226" marker-end="url(#cc-a)"/>
<path d="M370 128 V 166" marker-end="url(#cc-a)"/>
<path d="M370 226 V 248 H 295 V 272" marker-end="url(#cc-a)"/>
<path d="M370 248 H 445 V 272" marker-end="url(#cc-a)"/>
<path d="M512 312 H 604" marker-end="url(#cc-a)"/>
<path d="M780 280 V 246" marker-end="url(#cc-a)"/>
<path d="M608 228 H 592 V 400 H 295 V 354" marker-end="url(#cc-a)"/>
</g>
<path d="M780 168 V 122" fill="none" stroke="#e08a00" stroke-width="2.2" marker-end="url(#cc-o)"/>
<path d="M952 208 H 970 V 312 H 958" fill="none" stroke="#d1495b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#cc-r)"/>
<circle cx="370" cy="248" r="4" fill="#334155"/>

<!-- boxes -->
<g filter="url(#cc-sh)">
<rect x="20" y="168" width="130" height="64" rx="12" fill="#1a3f78"/>
<rect x="230" y="72" width="280" height="56" rx="10" fill="#ffffff" stroke="#2f6bb5" stroke-width="2"/>
<rect x="230" y="170" width="280" height="56" rx="10" fill="#ffffff" stroke="#2f6bb5" stroke-width="2"/>
<rect x="230" y="276" width="130" height="78" rx="10" fill="#e8f0fb" stroke="#2f6bb5" stroke-width="2"/>
<rect x="380" y="276" width="132" height="78" rx="10" fill="#ffffff" stroke="#2f6bb5" stroke-width="2"/>
<rect x="608" y="284" width="346" height="56" rx="10" fill="#ffffff" stroke="#7c5cbf" stroke-width="2"/>
<rect x="608" y="172" width="346" height="74" rx="10" fill="#fff4e0" stroke="#e08a00" stroke-width="2.5"/>
<rect x="680" y="60" width="200" height="58" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
</g>

<!-- box text -->
<g font-weight="800" fill="#1e293b" text-anchor="middle">
<text x="85" y="206" font-size="17" fill="#ffffff">API Server</text>
<text x="370" y="98" font-size="16">Reflector</text>
<text x="370" y="196" font-size="16">DeltaFIFO</text>
<text x="295" y="302" font-size="16">Indexer</text>
<text x="446" y="300" font-size="15">Event handler</text>
<text x="781" y="306" font-size="16">Workqueue</text>
<text x="781" y="200" font-size="16" fill="#8a4b00">Worker → syncHandler()</text>
<text x="780" y="85" font-size="15">雲端的VPC API</text>
</g>
<g font-size="12.5" font-weight="600" fill="#64748b" text-anchor="middle">
<text x="370" y="117">List + Watch</text>
<text x="370" y="215">Added / Updated / Deleted</text>
<text x="295" y="322">local Store</text>
<text x="295" y="340" font-family="SFMono-Regular, Menlo, monospace" font-size="11.5">{key: value}</text>
<text x="446" y="317" font-size="11.5">AddFunc</text>
<text x="446" y="332" font-size="11.5">UpdateFunc</text>
<text x="446" y="347" font-size="11.5">DeleteFunc</text>
<text x="781" y="223" fill="#8a4b00">比較期望狀態和實際狀態</text>
<text x="781" y="238" fill="#8a4b00">（唯一要自己寫的邏輯）</text>
<text x="780" y="104">實際的subnet</text>
</g>
<!-- key chips in workqueue -->
<g font-size="11.5" font-weight="700" font-family="SFMono-Regular, Menlo, monospace" fill="#5b3fa0">
<rect x="626" y="316" width="104" height="18" rx="9" fill="#f1ecfa"/><text x="678" y="329" text-anchor="middle">default/my-net</text>
<rect x="738" y="316" width="104" height="18" rx="9" fill="#f1ecfa"/><text x="790" y="329" text-anchor="middle">default/net-2</text>
<text x="862" y="329" fill="#94a3b8">…</text>
</g>

<!-- edge labels -->
<g font-size="12.5" font-weight="700" fill="#334155">
<text x="20" y="132">LIST + WATCH</text>
<text x="20" y="150" font-family="SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#2f6bb5">networkClient</text>
<text x="518" y="290">namespace/</text>
<text x="518" y="305">name</text>
<text x="772" y="268" text-anchor="end">Get()</text>
<text x="300" y="418">lister：讀最新的Network</text>
<text x="788" y="150" fill="#b45309">Create / Update / Delete</text>
<text x="952" y="268" fill="#d1495b" text-anchor="end">失敗：AddRateLimited</text>
</g>

<!-- etcd -->
<path d="M85 232 V 262" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#cc-a)"/>
<g fill="#e2e8f0" stroke="#64748b" stroke-width="1.5">
<path d="M49 274 V 318 A36 9 0 0 0 121 318 V 274"/>
<ellipse cx="85" cy="274" rx="36" ry="9"/>
</g>
<text x="85" y="304" font-size="15" font-weight="800" fill="#334155" text-anchor="middle">etcd</text>

<!-- step numbers -->
<g font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
<circle cx="230" cy="72" r="11" fill="#2f6bb5"/><text x="230" y="76">1</text>
<circle cx="230" cy="170" r="11" fill="#2f6bb5"/><text x="230" y="174">2</text>
<circle cx="230" cy="276" r="11" fill="#2f6bb5"/><text x="230" y="280">3</text>
<circle cx="380" cy="276" r="11" fill="#2f6bb5"/><text x="380" y="280">4</text>
<circle cx="608" cy="284" r="11" fill="#7c5cbf"/><text x="608" y="288">5</text>
<circle cx="608" cy="172" r="11" fill="#e08a00"/><text x="608" y="176">6</text>
</g>
</svg>
