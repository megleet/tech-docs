<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 22 868 280" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="ct-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect x="0" y="0" width="900" height="320" fill="#ffffff"/>

<!-- lines -->
<g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ct-a)">
<path d="M206 118 H 256"/>
<path d="M666 118 H 620"/>
<path d="M438 220 V 244"/>
</g>

<!-- CRD yaml -->
<rect x="16" y="40" width="190" height="164" rx="10" fill="#0e8a96"/>
<text x="111" y="64" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">① network-crd.yaml</text>
<text x="111" y="81" font-size="11" font-weight="800" fill="#ffe08a" text-anchor="middle">CRD：Network型別的定義</text>
<g font-family="SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#ffffff">
<text x="30" y="108">group: example.com</text>
<text x="30" y="126">kind: Network</text>
<text x="30" y="144">plural: networks</text>
<text x="30" y="162">versions: v1</text>
<text x="30" y="180">schema: cidr、gateway</text>
</g>

<!-- API Server -->
<rect x="258" y="30" width="360" height="190" rx="12" fill="#1a3f78"/>
<text x="278" y="56" font-size="17" font-weight="900" fill="#ffffff">API Server</text>
<text x="278" y="74" font-size="11" font-weight="800" fill="#ffe08a">認得的object型別（API樹）</text>
<g font-family="SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#dbe7f7">
<text x="280" y="102">/api/v1/pods</text>
<text x="280" y="124">/apis/apps/v1/deployments</text>
<text x="280" y="146">/apis/batch/v1/jobs</text>
</g>
<g font-size="10.5" font-weight="700" fill="#9fb6d8" text-anchor="end">
<text x="600" y="102">內建</text>
<text x="600" y="124">內建</text>
<text x="600" y="146">內建</text>
</g>
<rect x="272" y="158" width="334" height="28" rx="7" fill="#ffd23f"/>
<text x="280" y="177" font-family="SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="800" fill="#4a3600">/apis/example.com/v1/networks</text>
<text x="598" y="177" font-size="11" font-weight="800" fill="#4a3600" text-anchor="end">★ 新長出來</text>
<text x="278" y="206" font-size="11" font-weight="600" fill="#dbe7f7">schema：建立Network時檢查cidr、gateway</text>

<!-- my-net -->
<rect x="668" y="40" width="204" height="130" rx="10" fill="#d6457f"/>
<text x="770" y="64" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">② my-net.yaml</text>
<text x="770" y="81" font-size="11" font-weight="800" fill="#ffe08a" text-anchor="middle">CR：一個Network（第2節）</text>
<g font-family="SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#ffffff">
<text x="682" y="108">kind: Network</text>
<text x="682" y="126">cidr: 192.168.0.0/16</text>
<text x="682" y="144">gateway: 192.168.0.1</text>
</g>
<g font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">
<text x="770" y="190">API Server認得Network之後，</text>
<text x="770" y="206">才可以接收這個YAML</text>
</g>

<!-- labels on lines -->
<g paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">
<text x="231" y="100">kubectl</text>
<text x="231" y="113">apply</text>
<text x="643" y="100">kubectl</text>
<text x="643" y="113">apply</text>
<text x="452" y="237" text-anchor="start">存下CRD和Network</text>
</g>

<!-- etcd -->
<g fill="#2f9e6e" stroke="#2f9e6e" stroke-width="1.5">
<path d="M402 254 V 286 A36 9 0 0 0 474 286 V 254"/>
<ellipse cx="438" cy="254" rx="36" ry="9" fill="#57c08f"/>
</g>
<text x="438" y="280" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">etcd</text>
</svg>
