<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 10 860 534" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0284c7"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f9e6e"/>
    </marker>
    <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="860" height="560" fill="#ffffff"/>

  <!-- ===== Plane bands ===== -->
  <rect x="10" y="14" width="840" height="150" rx="14" fill="#f1f8fe"/>
  <rect x="10" y="236" width="840" height="236" rx="14" fill="#f8fafc"/>
  <g font-size="14" font-weight="800" fill="#475569">
    <text x="26" y="40">Control plane</text>
    <text x="26" y="262">Data plane（sidecar mode）</text>
  </g>

  <!-- ===== Control plane ===== -->
  <g filter="url(#sh)">
    <rect x="70" y="58" width="270" height="86" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="500" y="66" width="230" height="70" rx="12" fill="#04a3ff"/>
  </g>
  <text x="205" y="88" font-size="17" font-weight="800" fill="#1e293b" text-anchor="middle">Kubernetes API Server</text>
  <g font-size="12" fill="#475569" text-anchor="middle">
    <text x="205" y="112">Service、Pod</text>
    <text x="205" y="130">VirtualService、DestinationRule</text>
  </g>
  <text x="615" y="98" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">istiod</text>
  <text x="615" y="120" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">轉成Envoy的config、發certificate</text>

  <path d="M496 101 H 344" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ar)"/>
  <text x="420" y="92" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">watch</text>

  <!-- ===== xDS ===== -->
  <g fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="6 5">
    <path d="M550 136 C 520 205, 230 215, 210 281" marker-end="url(#arb)"/>
    <path d="M615 136 C 610 200, 440 215, 430 281" marker-end="url(#arb)"/>
    <path d="M680 136 C 685 200, 690 230, 690 281" marker-end="url(#arb)"/>
  </g>
  <rect x="170" y="176" width="210" height="28" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="275" y="195" font-size="13" font-weight="700" fill="#0284c7" text-anchor="middle">xDS：config + certificate</text>

  <!-- ===== Pods ===== -->
  <g filter="url(#sh)">
    <rect x="60" y="284" width="220" height="170" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="320" y="284" width="220" height="170" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="580" y="284" width="220" height="170" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <g font-size="13" font-weight="700" fill="#64748b">
    <text x="74" y="304">Pod</text>
    <text x="334" y="304">Pod</text>
    <text x="594" y="304">Pod</text>
  </g>
  <g filter="url(#sh)">
    <rect x="100" y="312" width="140" height="44" rx="10" fill="#7c5cbf"/>
    <rect x="360" y="312" width="140" height="44" rx="10" fill="#7c5cbf"/>
    <rect x="620" y="312" width="140" height="44" rx="10" fill="#7c5cbf"/>
    <circle cx="170" cy="424" r="25" fill="#f6bc00"/>
    <circle cx="430" cy="424" r="25" fill="#f6bc00"/>
    <circle cx="690" cy="424" r="25" fill="#f6bc00"/>
  </g>
  <g fill="#ffffff" text-anchor="middle" font-weight="800">
    <text x="170" y="340" font-size="17">Envoy</text>
    <text x="430" y="340" font-size="17">Envoy</text>
    <text x="690" y="340" font-size="17">Envoy</text>
    <text x="170" y="429" font-size="14">app</text>
    <text x="430" y="429" font-size="14">app</text>
    <text x="690" y="429" font-size="14">app</text>
  </g>

  <!-- app <-> Envoy -->
  <g fill="none" stroke="#334155" stroke-width="2">
    <path d="M170 396 V 360" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <path d="M430 396 V 360" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <path d="M690 396 V 360" marker-start="url(#ar)" marker-end="url(#ar)"/>
  </g>

  <!-- mTLS: both directions -->
  <g fill="none" stroke="#2f9e6e" stroke-width="3">
    <path d="M245 334 H 355" marker-start="url(#arg)" marker-end="url(#arg)"/>
    <path d="M505 334 H 615" marker-start="url(#arg)" marker-end="url(#arg)"/>
  </g>
  <g font-size="13" font-weight="800" fill="#2f9e6e" text-anchor="middle">
    <text x="300" y="324">mTLS</text>
    <text x="560" y="324">mTLS</text>
  </g>

  <!-- ===== Metrics ===== -->
  <g filter="url(#sh)">
    <rect x="345" y="496" width="170" height="44" rx="10" fill="#f97316"/>
  </g>
  <text x="430" y="524" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">Prometheus</text>
  <g fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="3 4">
    <path d="M170 456 C 170 490, 260 516, 341 516" marker-end="url(#arm)"/>
    <path d="M430 456 V 492" marker-end="url(#arm)"/>
    <path d="M690 456 C 690 490, 600 516, 519 516" marker-end="url(#arm)"/>
  </g>
  <text x="700" y="512" font-size="13" fill="#64748b">metrics、tracing</text>
  <text x="700" y="530" font-size="13" fill="#64748b">由Envoy直接產生</text>
</svg>
