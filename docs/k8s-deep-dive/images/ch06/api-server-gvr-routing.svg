</g><g fill="#ffffff" text-anchor="middle">
<text x="500.0" y="204.0" font-size="16" font-weight="800">A. Filters</text>
<text x="500.0" y="230.0" font-size="12" font-weight="600">限流（APF）、authentication、audit、authorization</text>
<text x="500.0" y="298" font-size="16" font-weight="800">B. 依URL找handler</text>
<text x="500.0" y="473.0" font-size="16" font-weight="800">C. Handler</text>
<text x="500.0" y="499.0" font-size="12" font-weight="600">Decode：JSON → v1 → internal version</text>
<text x="500.0" y="519.0" font-size="12" font-weight="600">mutating admission</text>
<text x="500.0" y="539.0" font-size="12" font-weight="600">→ schema validation</text>
<text x="500.0" y="559.0" font-size="12" font-weight="600">→ validating admission</text>
<text x="500.0" y="666.0" font-size="16" font-weight="800">D. Encode，write到etcd</text>
<text x="500.0" y="692.0" font-size="12" font-weight="600">internal version → storage version（v1）</text>
</g>
<g font-size="13" font-weight="800" font-family="SFMono-Regular, Menlo, monospace" text-anchor="middle">
<rect x="336" y="318" width="70" height="26" rx="6" fill="#ffffff"/><text x="371.0" y="336" fill="#0b6e78">/apis</text>
