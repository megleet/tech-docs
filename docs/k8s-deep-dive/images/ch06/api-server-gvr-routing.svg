<path d="M36 512 H 270 L 286 528 V 598 H 36 Z" fill="#ffedd5" stroke="#ea580c" stroke-width="2" stroke-linejoin="round"/><path d="M270 512 V 528 H 286" fill="none" stroke="#ea580c" stroke-width="2" stroke-linejoin="round"/>
<path d="M36 624 H 270 L 286 640 V 710 H 36 Z" fill="#fce7f3" stroke="#db2777" stroke-width="2" stroke-linejoin="round"/><path d="M270 624 V 640 H 286" fill="none" stroke="#db2777" stroke-width="2" stroke-linejoin="round"/>
</g><g text-anchor="middle">
<text x="161.0" y="428" font-size="15" font-weight="800" fill="#075985">request的version</text>
<text x="161.0" y="448" font-size="12" font-weight="700" fill="#075985" font-family="SFMono-Regular, Menlo, monospace">JSON（HTTP body）</text>
<text x="161.0" y="470" font-size="12" fill="#475569">client送來的，例如batch/v1</text>
<text x="161.0" y="536" font-size="15" font-weight="800" fill="#9a3412">internal version</text>
<text x="161.0" y="556" font-size="12" font-weight="700" fill="#9a3412" font-family="SFMono-Regular, Menlo, monospace">Go struct（mem裡）</text>
<text x="161.0" y="578" font-size="12" fill="#475569">admission和validation都對它做</text>
<text x="161.0" y="648" font-size="15" font-weight="800" fill="#9d174d">storage version</text>
<text x="161.0" y="668" font-size="12" font-weight="700" fill="#9d174d" font-family="SFMono-Regular, Menlo, monospace">protobuf（CRD用JSON）</text>
<text x="161.0" y="690" font-size="12" fill="#475569">實際存進etcd的version，只有一個</text>
</g>
<g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#ar)">
