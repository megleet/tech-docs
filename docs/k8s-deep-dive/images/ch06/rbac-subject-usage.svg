<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 16 806 416" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="su-a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<rect x="0" y="0" width="820" height="440" fill="#ffffff"/>

<!-- Group frame -->
<rect x="12" y="208" width="456" height="218" rx="14" fill="#f5f8fc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
<text x="26" y="228" font-size="12.5" font-weight="800" fill="#334155">Group：一次給一群身分</text>

<!-- lines: thicker = more common -->
<g fill="none" stroke="#475569" marker-end="url(#su-a)">
<path d="M460 66 H 576" stroke-width="4"/>
<path d="M460 160 H 576" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M460 281 H 576" stroke-width="2.5"/>
<path d="M460 375 H 576" stroke-width="2.5"/>
</g>

<!-- ServiceAccount -->
<rect x="20" y="20" width="440" height="92" rx="12" fill="#2f6fd1"/>
<text x="36" y="46" font-size="18" font-weight="900" fill="#ffffff">ServiceAccount</text>
<text x="184" y="45" font-size="12" font-weight="800" fill="#ffe08a">最常用：在cluster裡跑的程式</text>
<g font-size="11.5" font-weight="800" fill="#1d4f9e" text-anchor="middle">
<rect x="36" y="64" width="84" height="24" rx="12" fill="#ffffff"/><text x="78" y="80">controller</text>
<rect x="126" y="64" width="80" height="24" rx="12" fill="#ffffff"/><text x="166" y="80">Operator</text>
<rect x="212" y="64" width="92" height="24" rx="12" fill="#ffffff"/><text x="258" y="80">CI pipeline</text>
</g>
<text x="36" y="104" font-size="11" font-weight="600" fill="#dbe7fb">每個程式用自己的ServiceAccount</text>

<!-- User -->
<rect x="20" y="124" width="440" height="72" rx="12" fill="#c2621a"/>
<text x="36" y="150" font-size="18" font-weight="900" fill="#ffffff">User：<tspan font-family="SFMono-Regular, Menlo, monospace" font-size="16">carol</tspan></text>
<text x="152" y="149" font-size="12" font-weight="800" fill="#ffe08a">最少用：臨時給個別帳號</text>
<text x="36" y="182" font-size="11" font-weight="600" fill="#fde7d6">名字來自authentication，不是API object</text>

<!-- Group: system:serviceaccounts:mynamespace (members are ServiceAccounts) -->
<rect x="20" y="238" width="440" height="86" rx="12" fill="#6d4fc2"/>
<text x="36" y="262" font-size="16" font-weight="900" fill="#ffffff">Group：<tspan font-family="SFMono-Regular, Menlo, monospace" font-size="14">system:serviceaccounts:mynamespace</tspan></text>
<g font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle">
<rect x="36" y="272" width="110" height="24" rx="12" fill="#2f6fd1"/><text x="91" y="288">SA example-sa</text>
<rect x="152" y="272" width="84" height="24" rx="12" fill="#2f6fd1"/><text x="194" y="288">SA default</text>
<text x="252" y="288" fill="#e9e3f8">…</text>
</g>
<text x="36" y="314" font-size="11" font-weight="600" fill="#e9e3f8">成員是這個namespace的所有ServiceAccount，Kubernetes自動加入</text>

<!-- Group: dev-team (members are Users) -->
<rect x="20" y="332" width="440" height="86" rx="12" fill="#6d4fc2"/>
<text x="36" y="356" font-size="16" font-weight="900" fill="#ffffff">Group：<tspan font-family="SFMono-Regular, Menlo, monospace">dev-team</tspan></text>
<g font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle">
<rect x="36" y="366" width="88" height="24" rx="12" fill="#c2621a"/><text x="80" y="382">User alice</text>
<rect x="130" y="366" width="82" height="24" rx="12" fill="#c2621a"/><text x="171" y="382">User bob</text>
</g>
<text x="36" y="408" font-size="11" font-weight="600" fill="#e9e3f8">成員是User，由OIDC管理；有人加入或離開，RBAC不用改</text>

<!-- targets -->
<g font-weight="900" fill="#ffffff">
<rect x="580" y="34" width="230" height="64" rx="12" fill="#1f9d76"/>
<text x="596" y="60" font-size="16">Role</text>
<rect x="580" y="128" width="230" height="64" rx="12" fill="#1f9d76"/>
<text x="596" y="154" font-size="16">Role</text>
<rect x="580" y="249" width="230" height="64" rx="12" fill="#1f9d76"/>
<text x="596" y="275" font-size="16">ClusterRole <tspan font-family="SFMono-Regular, Menlo, monospace">view</tspan></text>
<rect x="580" y="343" width="230" height="64" rx="12" fill="#1f9d76"/>
<text x="596" y="369" font-size="16">ClusterRole <tspan font-family="SFMono-Regular, Menlo, monospace">edit</tspan></text>
</g>
<g font-size="11" font-weight="600" fill="#e3f7ef">
<text x="596" y="82">只給需要的最小權限</text>
<text x="596" y="176">臨時權限</text>
<text x="596" y="297">唯讀，只在一個namespace生效</text>
<text x="596" y="391">讀寫大部分object</text>
</g>

<!-- labels on lines -->
<g paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" font-size="11" font-weight="800" fill="#475569" text-anchor="middle">
<text x="518" y="58">RoleBinding</text>
<text x="518" y="152">RoleBinding</text>
<text x="518" y="273">RoleBinding</text>
<text x="518" y="367">RoleBinding</text>
</g>
</svg>
