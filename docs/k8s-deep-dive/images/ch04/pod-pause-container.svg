<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-ns" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0e9aa7"/></marker>
    <marker id="a-exec" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e0a800"/></marker>
    <marker id="a-cri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="590" fill="#ffffff"/>

  <!-- ===== Frames ===== -->
  <rect x="14" y="14" width="932" height="511" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="34" y="46" font-size="22" font-weight="800" fill="#1e293b">Node</text>
  <rect x="40" y="64" width="540" height="376" rx="14" fill="#f5f8fc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="60" y="96" font-size="22" font-weight="800" fill="#1e293b">Pod<tspan font-size="16" font-weight="600" fill="#475569">（CRI裡叫sandbox）</tspan></text>

  <!-- ===== Shared namespaces ===== -->
  <rect x="60" y="110" width="480" height="115" rx="12" fill="#e6f6f7" stroke="#0e9aa7" stroke-width="2"/>
  <text x="80" y="143" font-size="18" font-weight="700" fill="#0b5f66">共用的namespace：net · ipc · uts</text>
  <text x="80" y="174" font-size="15" font-family="Menlo, Consolas, monospace" fill="#1e293b">/proc/{pid}/ns/net → net:[4026532483]</text>
  <text x="80" y="203" font-size="14" fill="#334155">3個container看到的都是同一個</text>
  <g filter="url(#sh)"><rect x="440" y="140" width="90" height="70" rx="10" fill="#f5c542"/></g>
  <text x="485" y="170" font-size="18" font-weight="700" fill="#5b4300" text-anchor="middle">eth0</text>
  <text x="485" y="194" font-size="13" font-weight="600" fill="#5b4300" text-anchor="middle">10.244.1.5</text>

  <!-- ===== Containers -> namespaces ===== -->
  <g fill="none" stroke="#0e9aa7" stroke-width="2">
    <path d="M132 296 V 231" stroke-dasharray="6 5" marker-end="url(#a-ns)"/>
    <path d="M299 296 V 231" stroke-dasharray="6 5" marker-end="url(#a-ns)"/>
    <path d="M467 296 V 231" marker-end="url(#a-ns)"/>
  </g>
  <g font-size="14" font-weight="600" fill="#0b5f66">
    <text x="140" y="268">setns()加入</text>
    <text x="307" y="268">setns()加入</text>
    <text x="475" y="268">建立並持有</text>
  </g>

  <!-- ===== Containers ===== -->
  <g filter="url(#sh)">
    <rect x="60"  y="300" width="145" height="90" rx="12" fill="#2f9e6e"/>
    <rect x="227" y="300" width="145" height="90" rx="12" fill="#2f9e6e"/>
    <rect x="395" y="300" width="145" height="90" rx="12" fill="#1a3f78"/>
  </g>
  <g fill="#ffffff" text-anchor="middle">
    <text x="132" y="337" font-size="19" font-weight="700">container A</text>
    <text x="132" y="363" font-size="14">app（例如nginx）</text>
    <text x="299" y="337" font-size="19" font-weight="700">container B</text>
    <text x="299" y="363" font-size="14">sidecar（例如Envoy）</text>
    <text x="467" y="328" font-size="18" font-weight="700">pause container</text>
    <text x="467" y="352" font-size="13">registry.k8s.io/pause</text>
    <text x="467" y="373" font-size="13">PID 1只呼叫pause()</text>
  </g>
  <text x="60" y="425" font-size="14" fill="#475569">mnt、cgroup：每個container各自一份（各自的rootfs）</text>

  <!-- ===== Runtime / CNI / host network ===== -->
  <g filter="url(#sh)">
    <rect x="680" y="36" width="240" height="60" rx="12" fill="#ffffff"/>
    <rect x="680" y="135" width="240" height="60" rx="12" fill="#fff7d6" stroke="#e0a800" stroke-width="2"/>
    <rect x="680" y="420" width="180" height="60" rx="12" fill="#f5c542"/>
  </g>
  <text x="800" y="62" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">container runtime</text>
  <text x="800" y="84" font-size="13" fill="#475569" text-anchor="middle">containerd / CRI-O</text>
  <text x="800" y="161" font-size="18" font-weight="700" fill="#5b4300" text-anchor="middle">CNI plugin</text>
  <text x="800" y="183" font-size="13" fill="#5b4300" text-anchor="middle">建veth、分配IP、設路由</text>
  <text x="770" y="446" font-size="18" font-weight="700" fill="#5b4300" text-anchor="middle">cni0</text>
  <text x="770" y="468" font-size="13" fill="#5b4300" text-anchor="middle">host上的bridge</text>

  <!-- ① runtime creates the sandbox (pause first) -->
  <path d="M920 66 H 932 V 505 H 467 V 394" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a-cri)"/>
  <text x="700" y="498" font-size="15" font-weight="600" fill="#1e293b" text-anchor="middle">① 建立sandbox：先啟動pause container</text>
  <!-- ② runtime calls CNI -->
  <path d="M800 96 V 131" fill="none" stroke="#e0a800" stroke-width="2" marker-end="url(#a-exec)"/>
  <text x="810" y="120" font-size="14" font-weight="600" fill="#a77d00">② 呼叫CNI</text>
  <!-- ③ CNI sets up the Pod's network namespace -->
  <path d="M680 165 H 534" fill="none" stroke="#e0a800" stroke-width="2" marker-end="url(#a-exec)"/>
  <text x="607" y="155" font-size="14" font-weight="600" fill="#a77d00" text-anchor="middle">③ 設定網路</text>
  <!-- veth pair: eth0 <-> cni0 -->
  <path d="M680 450 H 600 V 195 H 530" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="614" y="330" font-size="13" font-weight="600" fill="#475569" text-anchor="middle" transform="rotate(-90 614 330)">veth pair</text>

  <!-- ===== Legend ===== -->
  <g font-size="15" fill="#334155">
    <rect x="30"  y="551" width="18" height="18" rx="4" fill="#1a3f78"/><text x="56"  y="566">pause container</text>
    <rect x="200" y="551" width="18" height="18" rx="4" fill="#2f9e6e"/><text x="226" y="566">使用者的container</text>
    <rect x="380" y="551" width="18" height="18" rx="4" fill="#e6f6f7" stroke="#0e9aa7" stroke-width="2"/><text x="406" y="566">共用的namespace</text>
    <rect x="550" y="551" width="18" height="18" rx="4" fill="#f5c542"/><text x="576" y="566">網路設備</text>
    <path d="M680 560 h34" stroke="#0e9aa7" stroke-width="2" stroke-dasharray="6 5"/><text x="722" y="566">setns()加入</text>
  </g>
</svg>
