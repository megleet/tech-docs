<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 4 920 410" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><filter id="cp-sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs>
<rect y="0" width="920" height="440" fill="#ffffff"/>

<!-- roof -->
<g filter="url(#cp-sh)">
<polygon points="40,90 460,8 880,90" fill="#334155"/>
</g>
<text x="460" y="72" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">Container</text>

<!-- dynamic / static view -->
<path d="M62 132 V 122 H 578 V 132" fill="none" stroke="#1e293b" stroke-width="2"/>
<text x="314" y="112" font-size="13.5" font-weight="800" fill="#1e293b" text-anchor="end">Container Runtime</text>
<rect x="322" y="96" width="104" height="22" rx="11" fill="#dc2626"/><text x="374" y="112" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle">dynamic view</text>
<path d="M622 132 V 122 H 858 V 132" fill="none" stroke="#1e293b" stroke-width="2"/>
<text x="734" y="112" font-size="13.5" font-weight="800" fill="#1e293b" text-anchor="end">Container Image</text>
<rect x="742" y="96" width="94" height="22" rx="11" fill="#dc2626"/><text x="789" y="112" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle">static view</text>

<!-- pillars: Namespace, cgroups (dynamic) | rootfs (static) -->
<!-- Namespace -->
<g filter="url(#cp-sh)">
<g transform="translate(-280,0)">
<rect x="342" y="140" width="236" height="12" rx="3" fill="#7c5cbf"/>
<rect x="350" y="152" width="220" height="146" fill="#f8f5fd" stroke="#7c5cbf" stroke-width="2"/>
<rect x="342" y="298" width="236" height="12" rx="3" fill="#7c5cbf"/>
</g>
</g>
<g transform="translate(-280,0)">
<g font-size="18" font-weight="800" text-anchor="middle"><text x="460" y="184" fill="#6d3fc0">🧱 Namespace</text></g>
<g font-size="13" font-weight="700" text-anchor="middle"><text x="460" y="208"><tspan fill="#6d3fc0" font-weight="800">隔離</tspan><tspan fill="#475569">：修改process視圖</tspan></text></g>
<!-- namespace chips -->
<g font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">
<rect x="372" y="222" width="52" height="28" rx="7" fill="#ffffff" stroke="#c4b2ea"/><text x="398" y="241">PID</text>
<rect x="434" y="222" width="52" height="28" rx="7" fill="#ffffff" stroke="#c4b2ea"/><text x="460" y="241">NET</text>
<rect x="496" y="222" width="52" height="28" rx="7" fill="#ffffff" stroke="#c4b2ea"/><text x="522" y="241">MNT</text>
<rect x="372" y="258" width="52" height="28" rx="7" fill="#ffffff" stroke="#c4b2ea"/><text x="398" y="277">UTS</text>
<rect x="434" y="258" width="52" height="28" rx="7" fill="#ffffff" stroke="#c4b2ea"/><text x="460" y="277">IPC</text>
<rect x="496" y="258" width="52" height="28" rx="7" fill="#ffffff" stroke="#c4b2ea"/><text x="522" y="277">…</text>
</g>
</g>
<!-- cgroups -->
<g filter="url(#cp-sh)">
<g transform="translate(-280,0)">
<rect x="622" y="140" width="236" height="12" rx="3" fill="#e08a00"/>
<rect x="630" y="152" width="220" height="146" fill="#fffaf0" stroke="#e08a00" stroke-width="2"/>
<rect x="622" y="298" width="236" height="12" rx="3" fill="#e08a00"/>
</g>
</g>
<g transform="translate(-280,0)">
<g font-size="18" font-weight="800" text-anchor="middle"><text x="740" y="184" fill="#b45309">📊 cgroups</text></g>
<g font-size="13" font-weight="700" text-anchor="middle"><text x="740" y="208"><tspan fill="#b45309" font-weight="800">限制</tspan><tspan fill="#475569">：製造限制約束</tspan></text></g>
<!-- cgroups chips -->
<g font-size="12.5" font-weight="700" fill="#b45309" text-anchor="middle">
<rect x="648" y="222" width="88" height="28" rx="7" fill="#ffffff" stroke="#f3c27a"/><text x="692" y="241">⚙️ CPU</text>
<rect x="744" y="222" width="88" height="28" rx="7" fill="#ffffff" stroke="#f3c27a"/><text x="788" y="241">🧠 mem</text>
<rect x="648" y="258" width="88" height="28" rx="7" fill="#ffffff" stroke="#f3c27a"/><text x="692" y="277">💾 Block I/O</text>
<rect x="744" y="258" width="88" height="28" rx="7" fill="#ffffff" stroke="#f3c27a"/><text x="788" y="277">🔢 PIDs</text>
</g>
</g>
<!-- rootfs -->
<g filter="url(#cp-sh)">
<g transform="translate(560,0)">
<rect x="62" y="140" width="236" height="12" rx="3" fill="#2f6bb5"/>
<rect x="70" y="152" width="220" height="146" fill="#f5f9ff" stroke="#2f6bb5" stroke-width="2"/>
<rect x="62" y="298" width="236" height="12" rx="3" fill="#2f6bb5"/>
</g>
</g>
<g transform="translate(560,0)">
<g font-size="18" font-weight="800" text-anchor="middle"><text x="180" y="184" fill="#1a4fae">📁 rootfs</text></g>
<g font-size="13" font-weight="700" text-anchor="middle"><text x="180" y="208"><tspan fill="#1a4fae" font-weight="800">替換</tspan><tspan fill="#475569">：更換根目錄檔案</tspan></text></g>
<!-- rootfs chips -->
<rect x="130" y="222" width="100" height="26" rx="6" fill="#e8f0fb"/>
<text x="180" y="240" font-size="13.5" font-weight="800" fill="#1a4fae" text-anchor="middle">OverlayFS</text>
<g font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">
<rect x="84" y="258" width="92" height="28" rx="7" fill="#ffffff" stroke="#9ec1ec"/><text x="130" y="277">image layers</text>
<rect x="184" y="258" width="92" height="28" rx="7" fill="#ffffff" stroke="#9ec1ec"/><text x="230" y="277">writable layer</text>
</g>
</g>

<!-- security band -->
<g filter="url(#cp-sh)">
<rect x="40" y="320" width="840" height="44" rx="10" fill="#e3f4e8" stroke="#2e7d5b" stroke-width="2"/>
</g>
<text x="60" y="348" font-size="15" font-weight="800" fill="#1d6b4a">🔒 Security<tspan font-size="13" fill="#1d6b4a">　收斂</tspan><tspan font-size="13" font-weight="700" fill="#475569">：拆分root權限</tspan></text>
<g font-size="12.5" font-weight="700" fill="#1d6b4a" text-anchor="middle">
<rect x="398" y="328" width="104" height="28" rx="7" fill="#ffffff" stroke="#9fd3b4"/><text x="450" y="347">🔑 capabilities</text>
<rect x="510" y="328" width="90" height="28" rx="7" fill="#ffffff" stroke="#9fd3b4"/><text x="555" y="347">🛡️ seccomp</text>
<rect x="608" y="328" width="134" height="28" rx="7" fill="#ffffff" stroke="#9fd3b4"/><text x="675" y="347">🏠 LSM</text>
<rect x="750" y="328" width="118" height="28" rx="7" fill="#ffffff" stroke="#9fd3b4"/><text x="809" y="347">user namespace</text>
</g>

<!-- foundation -->
<rect x="20" y="372" width="880" height="38" rx="8" fill="#1e293b"/>
<text x="460" y="396" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">shared Linux kernel</text>
</svg>
