<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 828 258" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="cg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e08a00"/></marker></defs>
<rect width="860" height="290" fill="#ffffff"/>
<rect x="20" y="20" width="260" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="150" y="46" font-size="14.5" font-weight="800" fill="#334155" text-anchor="middle">Quota inheritance &amp; limit</text>
<text x="150" y="66" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">子cgroup的限制不能超過父cgroup</text>
<path d="M150 126 V146 M88 146 H212 M88 146 V166 M212 146 V166" fill="none" stroke="#e3b46b" stroke-width="2"/>
<rect x="50" y="82" width="200" height="44" rx="8" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
<text x="150" y="100" font-size="12.5" font-weight="800" fill="#8a4b00" text-anchor="middle" >parent</text>
<text x="150" y="118" font-size="12" font-weight="600" fill="#8a4b00" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">memory.max = 1G</text>
<rect x="30" y="166" width="116" height="62" rx="8" fill="#ffffff" stroke="#e08a00" stroke-width="1.5"/>
<text x="88" y="184" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="middle">child-1</text>
<text x="88" y="201" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">memory.max=2G</text>
<text x="88" y="217" font-size="11" font-weight="600" fill="#b3261e" text-anchor="middle" >→ 實際最多1G</text>
<rect x="154" y="166" width="116" height="62" rx="8" fill="#ffffff" stroke="#e08a00" stroke-width="1.5"/>
<text x="212" y="184" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="middle">child-2</text>
<text x="212" y="201" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">memory.max=500M</text>
<text x="150" y="252" font-size="12" font-weight="700" fill="#8a4b00" text-anchor="middle">child-1設了2G，仍被parent的1G蓋住</text>
<rect x="300" y="20" width="260" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="430" y="46" font-size="14.5" font-weight="800" fill="#334155" text-anchor="middle">Upward accounting</text>
<text x="430" y="66" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">父cgroup的用量 = 所有子孫的總和</text>
<path d="M368 166 V146 H430 V130" fill="none" stroke="#e08a00" stroke-width="2" marker-end="url(#cg-a)"/>
<path d="M492 166 V146 H430 V130" fill="none" stroke="#e08a00" stroke-width="2" marker-end="url(#cg-a)"/>
<rect x="330" y="82" width="200" height="44" rx="8" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
<text x="430" y="100" font-size="12.5" font-weight="800" fill="#8a4b00" text-anchor="middle" >parent</text>
<text x="430" y="118" font-size="12" font-weight="600" fill="#8a4b00" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">memory.current = 500M</text>
<rect x="310" y="166" width="116" height="62" rx="8" fill="#ffffff" stroke="#e08a00" stroke-width="1.5"/>
<text x="368" y="184" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="middle">child-1</text>
<text x="368" y="201" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">memory.current</text>
<text x="368" y="217" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">= 300M</text>
<rect x="434" y="166" width="116" height="62" rx="8" fill="#ffffff" stroke="#e08a00" stroke-width="1.5"/>
<text x="492" y="184" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="middle">child-2</text>
<text x="492" y="201" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">memory.current</text>
<text x="492" y="217" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">= 200M</text>
<text x="430" y="252" font-size="12" font-weight="700" fill="#8a4b00" text-anchor="middle">300M + 200M = 500M</text>
<rect x="580" y="20" width="260" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="710" y="46" font-size="14.5" font-weight="800" fill="#334155" text-anchor="middle">Downward control</text>
<text x="710" y="66" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">父層打開controller，子層才能用</text>
<path d="M710 126 V146 H648 V162" fill="none" stroke="#e08a00" stroke-width="2" marker-end="url(#cg-a)"/>
<path d="M710 126 V146 H772 V162" fill="none" stroke="#e08a00" stroke-width="2" marker-end="url(#cg-a)"/>
<rect x="610" y="82" width="200" height="44" rx="8" fill="#fff4e0" stroke="#e08a00" stroke-width="2"/>
<text x="710" y="100" font-size="12.5" font-weight="800" fill="#8a4b00" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">cgroup.subtree_control</text>
<text x="710" y="118" font-size="12" font-weight="600" fill="#8a4b00" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">+cpu +memory</text>
<rect x="590" y="166" width="116" height="62" rx="8" fill="#ffffff" stroke="#e08a00" stroke-width="1.5"/>
<text x="648" y="184" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="middle">child-1</text>
<text x="648" y="201" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">cpu.max</text>
<text x="648" y="217" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">memory.max</text>
<rect x="714" y="166" width="116" height="62" rx="8" fill="#ffffff" stroke="#e08a00" stroke-width="1.5"/>
<text x="772" y="184" font-size="12" font-weight="800" fill="#8a4b00" text-anchor="middle">child-2</text>
<text x="772" y="201" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">cpu.max</text>
<text x="772" y="217" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" font-family="SFMono-Regular, Menlo, monospace">memory.max</text>
<text x="710" y="252" font-size="12" font-weight="700" fill="#8a4b00" text-anchor="middle">子cgroup裡才出現對應的file</text>
</svg>
