<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 16 618 396" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<rect width="650" height="424" fill="#ffffff"/>
<rect x="20" y="20" width="610" height="30" rx="7" fill="#334155"/>
<text x="38" y="40" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">#</text>
<text x="131" y="40" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Namespace</text>
<text x="318" y="40" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">隔離什麼</text>
<text x="530" y="40" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">container裡的效果</text>
<rect x="20" y="52" width="610" height="44" fill="#ffffff"/>
<circle cx="36" cy="74" r="11" fill="#7c5cbf"/><text x="36" y="78.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
<text x="62" y="81" font-size="18">🔢</text>
<text x="92" y="71" font-size="14" font-weight="800" fill="#1e293b">PID</text>
<text x="92" y="87" font-size="10.5" font-weight="500" fill="#7a6a9e" font-family="SFMono-Regular, Menlo, monospace">CLONE_NEWPID</text>
<text x="218" y="70" font-size="12.5" font-weight="800" fill="#1e293b">process ID</text>
<rect x="218" y="76" width="156" height="17" rx="8.5" fill="#334155"/>
<text x="226" y="88.5" font-size="11" font-weight="500" fill="#ffffff">→ 我看得到哪些process？</text>
<text x="442" y="70" font-size="12" font-weight="400" fill="#334155">第一個process是PID 1</text>
<text x="442" y="87" font-size="12" font-weight="400" fill="#334155">看不到host上其他process</text>
<rect x="20" y="96" width="610" height="44" fill="#f6f3fc"/>
<circle cx="36" cy="118" r="11" fill="#7c5cbf"/><text x="36" y="122.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
<text x="62" y="125" font-size="18">📁</text>
<text x="92" y="115" font-size="14" font-weight="800" fill="#1e293b">Mount</text>
<text x="92" y="131" font-size="10.5" font-weight="500" fill="#7a6a9e" font-family="SFMono-Regular, Menlo, monospace">CLONE_NEWNS</text>
<text x="218" y="114" font-size="12.5" font-weight="800" fill="#1e293b">mount point / filesystem</text>
<rect x="218" y="120" width="133" height="17" rx="8.5" fill="#334155"/>
<text x="226" y="132.5" font-size="11" font-weight="500" fill="#ffffff">→ 我看得到哪些檔案？</text>
<text x="442" y="114" font-size="12" font-weight="400" fill="#334155">有自己的/、/proc、/dev</text>
<text x="442" y="131" font-size="12" font-weight="400" fill="#334155">等filesystem view</text>
<rect x="20" y="140" width="610" height="44" fill="#ffffff"/>
<circle cx="36" cy="162" r="11" fill="#7c5cbf"/><text x="36" y="166.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
<text x="62" y="169" font-size="18">🌐</text>
<text x="92" y="159" font-size="14" font-weight="800" fill="#1e293b">Network</text>
<text x="92" y="175" font-size="10.5" font-weight="500" fill="#7a6a9e" font-family="SFMono-Regular, Menlo, monospace">CLONE_NEWNET</text>
<text x="218" y="158" font-size="12.5" font-weight="800" fill="#1e293b">network stack</text>
<rect x="218" y="164" width="156" height="17" rx="8.5" fill="#334155"/>
<text x="226" y="176.5" font-size="11" font-weight="500" fill="#ffffff">→ 我有哪些network資源？</text>
<text x="442" y="158" font-size="12" font-weight="400" fill="#334155">獨立的network device、</text>
<text x="442" y="175" font-size="12" font-weight="400" fill="#334155">IP、routing table、port</text>
<rect x="20" y="184" width="610" height="44" fill="#f6f3fc"/>
<circle cx="36" cy="206" r="11" fill="#7c5cbf"/><text x="36" y="210.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
<text x="62" y="213" font-size="18">💬</text>
<text x="92" y="203" font-size="14" font-weight="800" fill="#1e293b">IPC</text>
<text x="92" y="219" font-size="10.5" font-weight="500" fill="#7a6a9e" font-family="SFMono-Regular, Menlo, monospace">CLONE_NEWIPC</text>
<text x="218" y="202" font-size="12.5" font-weight="800" fill="#1e293b">IPC資源</text>
<rect x="218" y="208" width="176" height="17" rx="8.5" fill="#334155"/>
<text x="226" y="220.5" font-size="11" font-weight="500" fill="#ffffff">→ 我能和哪些process做IPC？</text>
<text x="442" y="202" font-size="12" font-weight="400" fill="#334155">隔離shared mem、</text>
<text x="442" y="219" font-size="12" font-weight="400" fill="#334155">message queue、semaphore</text>
<rect x="20" y="228" width="610" height="44" fill="#ffffff"/>
<circle cx="36" cy="250" r="11" fill="#7c5cbf"/><text x="36" y="254.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>
<text x="62" y="257" font-size="18">🏷️</text>
<text x="92" y="247" font-size="14" font-weight="800" fill="#1e293b">UTS</text>
<text x="92" y="263" font-size="10.5" font-weight="500" fill="#7a6a9e" font-family="SFMono-Regular, Menlo, monospace">CLONE_NEWUTS</text>
<text x="218" y="246" font-size="12.5" font-weight="800" fill="#1e293b">hostname / domain name</text>
<rect x="218" y="252" width="151" height="17" rx="8.5" fill="#334155"/>
<text x="226" y="264.5" font-size="11" font-weight="500" fill="#ffffff">→ 我的hostname是什麼？</text>
<text x="442" y="254" font-size="12" font-weight="400" fill="#334155">可以有自己的hostname</text>
<rect x="20" y="272" width="610" height="44" fill="#f6f3fc"/>
<circle cx="36" cy="294" r="11" fill="#7c5cbf"/><text x="36" y="298.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">6</text>
<text x="62" y="301" font-size="18">👤</text>
<text x="92" y="291" font-size="14" font-weight="800" fill="#1e293b">User</text>
<text x="92" y="307" font-size="10.5" font-weight="500" fill="#7a6a9e" font-family="SFMono-Regular, Menlo, monospace">CLONE_NEWUSER</text>
<text x="218" y="290" font-size="12.5" font-weight="800" fill="#1e293b">UID / GID</text>
<rect x="218" y="296" width="144" height="17" rx="8.5" fill="#334155"/>
<text x="226" y="308.5" font-size="11" font-weight="500" fill="#ffffff">→ 我是誰、有什麼權限？</text>
<text x="442" y="290" font-size="12" font-weight="400" fill="#334155">container的root（UID 0）</text>
<text x="442" y="307" font-size="12" font-weight="400" fill="#334155">對應到host上的普通user</text>
<rect x="20" y="316" width="610" height="44" fill="#ffffff"/>
<circle cx="36" cy="338" r="11" fill="#7c5cbf"/><text x="36" y="342.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">7</text>
<text x="62" y="345" font-size="18">📊</text>
<text x="92" y="335" font-size="14" font-weight="800" fill="#1e293b">Cgroup</text>
<text x="92" y="351" font-size="10.5" font-weight="500" fill="#7a6a9e" font-family="SFMono-Regular, Menlo, monospace">CLONE_NEWCGROUP</text>
<text x="218" y="334" font-size="12.5" font-weight="800" fill="#1e293b">cgroup hierarchy</text>
<rect x="218" y="340" width="149" height="17" rx="8.5" fill="#334155"/>
<text x="226" y="352.5" font-size="11" font-weight="500" fill="#ffffff">→ 我看到哪一層cgroup？</text>
<text x="442" y="334" font-size="12" font-weight="400" fill="#334155">/proc/self/cgroup</text>
<text x="442" y="351" font-size="12" font-weight="400" fill="#334155">只顯示自己那一層</text>
<rect x="20" y="360" width="610" height="44" fill="#f6f3fc"/>
<circle cx="36" cy="382" r="11" fill="#7c5cbf"/><text x="36" y="386.5" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">8</text>
<text x="62" y="389" font-size="18">⏱️</text>
<text x="92" y="379" font-size="14" font-weight="800" fill="#1e293b">Time</text>
<text x="92" y="395" font-size="10.5" font-weight="500" fill="#7a6a9e" font-family="SFMono-Regular, Menlo, monospace">CLONE_NEWTIME</text>
<text x="218" y="378" font-size="12.5" font-weight="800" fill="#1e293b">system clock</text>
<rect x="218" y="384" width="144" height="17" rx="8.5" fill="#334155"/>
<text x="226" y="396.5" font-size="11" font-weight="500" fill="#ffffff">→ 我的系統時鐘是多少？</text>
<text x="442" y="378" font-size="12" font-weight="400" fill="#334155">自己的CLOCK_MONOTONIC /</text>
<text x="442" y="395" font-size="12" font-weight="400" fill="#334155">CLOCK_BOOTTIME offset</text>
<g stroke="#e5e0f0" stroke-width="1"><line x1="56" y1="52" x2="56" y2="404"/><line x1="206" y1="52" x2="206" y2="404"/><line x1="430" y1="52" x2="430" y2="404"/></g>
<rect x="20" y="52" width="610" height="352" fill="none" stroke="#e5e0f0" stroke-width="1.5"/>
</svg>
