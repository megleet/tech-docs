<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 900 266" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
<marker id="pim-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
<marker id="pim-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d1495b"/></marker>
<filter id="pim-sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.10"/></filter>
<!-- a shipping container: 120 x 64, ribs -->
<g id="pim-box">
<rect x="0" y="0" width="120" height="64" rx="4" stroke-width="2"/>
<g stroke-width="1.2" stroke-opacity="0.45">
<line x1="14" y1="6" x2="14" y2="58"/><line x1="28" y1="6" x2="28" y2="58"/><line x1="92" y1="6" x2="92" y2="58"/><line x1="106" y1="6" x2="106" y2="58"/>
</g>
</g>
</defs>
<rect y="0" width="900" height="280" fill="#ffffff"/>

<!-- panels -->
<g filter="url(#pim-sh)" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5">
<rect x="20" y="14" width="270" height="256" rx="14"/>
<rect x="315" y="14" width="270" height="256" rx="14"/>
<rect x="610" y="14" width="270" height="256" rx="14"/>
</g>
<g font-size="19" font-weight="800" text-anchor="middle">
<text x="155" y="46" fill="#8a4b00">① 封裝</text>
<text x="450" y="46" fill="#1a3f78">② 隔離</text>
<text x="745" y="46" fill="#0b6e78">③ 移動</text>
</g>

<!-- ① pack: app goes into a container -->
<rect x="58" y="72" width="54" height="30" rx="8" fill="#de69a5"/>
<text x="85" y="92" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">app</text>
<path d="M112 87 C 140 87, 150 110, 150 124" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#pim-a)"/>
<use href="#pim-box" x="95" y="130" fill="#fff4e0" stroke="#e08a00"/>
<rect x="128" y="146" width="54" height="30" rx="8" fill="#de69a5"/>
<text x="155" y="166" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">app</text>
<g font-size="13" font-weight="700" fill="#334155" text-anchor="middle">
<text x="155" y="224">像一個集裝箱一樣，</text>
<text x="155" y="244">把你的app「裝」起來</text>
</g>

<!-- ② isolate: two containers, boundary between -->
<use href="#pim-box" x="324" y="104" fill="#e8f0fb" stroke="#2f6bb5"/>
<use href="#pim-box" x="456" y="104" fill="#e3f4e8" stroke="#2e7d5b"/>
<text x="384" y="141" font-size="13" font-weight="800" fill="#1a3f78" text-anchor="middle">app A</text>
<text x="516" y="141" font-size="13" font-weight="800" fill="#1d5c43" text-anchor="middle">app B</text>
<line x1="450" y1="92" x2="450" y2="180" stroke="#334155" stroke-width="4"/>
<path d="M394 98 C 414 70, 486 70, 506 98" fill="none" stroke="#d1495b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#pim-r)"/>
<text x="450" y="70" font-size="20" font-weight="800" fill="#d1495b" text-anchor="middle">✗</text>
<g font-size="13" font-weight="700" fill="#334155" text-anchor="middle">
<text x="450" y="224">app與app之間，因為有了邊界</text>
<text x="450" y="244">而不至於相互干擾</text>
</g>

<!-- ③ move: same container on laptop -> server -> cloud -->
<g transform="translate(685 70) scale(0.5)"><use href="#pim-box" fill="#e3f6f4" stroke="#0e9aa7"/></g>
<text x="715" y="91" font-size="11" font-weight="800" fill="#0b6e78" text-anchor="middle">app</text>
<g font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">
<rect x="628" y="140" width="66" height="34" rx="8" fill="#64748b"/><text x="661" y="162">laptop</text>
<rect x="712" y="140" width="66" height="34" rx="8" fill="#475569"/><text x="745" y="162">server</text>
<rect x="796" y="140" width="66" height="34" rx="8" fill="#334155"/><text x="829" y="162">cloud</text>
</g>
<path d="M694 157 H 708" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#pim-a)"/>
<path d="M778 157 H 792" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#pim-a)"/>
<path d="M715 104 V 134" fill="none" stroke="#0e9aa7" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#pim-a)"/>
<path d="M745 86 C 790 86, 829 100, 829 134" fill="none" stroke="#0e9aa7" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#pim-a)"/>
<path d="M685 86 C 661 86, 661 110, 661 134" fill="none" stroke="#0e9aa7" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#pim-a)"/>
<g font-size="13" font-weight="700" fill="#334155" text-anchor="middle">
<text x="745" y="224">被裝進集裝箱的app，</text>
<text x="745" y="244">也可以被方便地搬來搬去</text>
</g>
</svg>
