<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 8 1200 378" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif">
<rect y="0" width="1200" height="400" fill="#ffffff"/>

<!-- titles -->
<text x="200" y="32" font-size="17" font-weight="800" fill="#334155" text-anchor="middle">VM：hypervisor-based virtualization</text>
<text x="600" y="32" font-size="17" font-weight="800" fill="#c62828" text-anchor="middle">✗ Container：錯誤的理解</text>
<text x="1000" y="32" font-size="17" font-weight="800" fill="#2e7d32" text-anchor="middle">✓ Container：正確</text>

<!-- ===== VM ===== -->
<g font-weight="700" text-anchor="middle" fill="#ffffff">
<rect x="20" y="50" width="112" height="40" rx="6" fill="#6aa84f"/><text x="76" y="76" font-size="16">App 1</text>
<rect x="144" y="50" width="112" height="40" rx="6" fill="#f0a030"/><text x="200" y="76" font-size="16">App 2</text>
<rect x="268" y="50" width="112" height="40" rx="6" fill="#e0612c"/><text x="324" y="76" font-size="16">App 3</text>
<rect x="20" y="96" width="112" height="36" rx="6" fill="#8fc078"/><text x="76" y="119" font-size="14">Bins / Libs</text>
<rect x="144" y="96" width="112" height="36" rx="6" fill="#f5bd66"/><text x="200" y="119" font-size="14">Bins / Libs</text>
<rect x="268" y="96" width="112" height="36" rx="6" fill="#ec8a5e"/><text x="324" y="119" font-size="14">Bins / Libs</text>
<rect x="20" y="138" width="112" height="96" rx="6" fill="#6aa84f" fill-opacity="0.75"/><text x="76" y="184" font-size="16">Guest OS</text><text x="76" y="204" font-size="12">（含kernel）</text>
<rect x="144" y="138" width="112" height="96" rx="6" fill="#f0a030" fill-opacity="0.75"/><text x="200" y="184" font-size="16">Guest OS</text><text x="200" y="204" font-size="12">（含kernel）</text>
<rect x="268" y="138" width="112" height="96" rx="6" fill="#e0612c" fill-opacity="0.75"/><text x="324" y="184" font-size="16">Guest OS</text><text x="324" y="204" font-size="12">（含kernel）</text>
<rect x="20" y="242" width="360" height="36" rx="6" fill="#9aa5b1"/><text x="200" y="266" font-size="16">Hypervisor</text>
<rect x="20" y="284" width="360" height="36" rx="6" fill="#64748b"/><text x="200" y="308" font-size="16">Host OS</text>
<rect x="20" y="326" width="360" height="50" rx="6" fill="#334155"/><text x="200" y="357" font-size="16">Infrastructure</text>
</g>

<!-- ===== wrong container ===== -->
<g font-weight="700" text-anchor="middle" fill="#ffffff" opacity="0.85">
<rect x="420" y="154" width="112" height="40" rx="6" fill="#6aa84f"/><text x="476" y="180" font-size="16">App 1</text>
<rect x="544" y="154" width="112" height="40" rx="6" fill="#f0a030"/><text x="600" y="180" font-size="16">App 2</text>
<rect x="668" y="154" width="112" height="40" rx="6" fill="#e0612c"/><text x="724" y="180" font-size="16">App 3</text>
<rect x="420" y="200" width="112" height="36" rx="6" fill="#8fc078"/><text x="476" y="223" font-size="14">Bins / Libs</text>
<rect x="544" y="200" width="112" height="36" rx="6" fill="#f5bd66"/><text x="600" y="223" font-size="14">Bins / Libs</text>
<rect x="668" y="200" width="112" height="36" rx="6" fill="#ec8a5e"/><text x="724" y="223" font-size="14">Bins / Libs</text>
<rect x="420" y="242" width="360" height="36" rx="6" fill="#5bb8e6"/><text x="600" y="266" font-size="16">Container Engine</text>
<rect x="420" y="284" width="360" height="36" rx="6" fill="#64748b"/><text x="600" y="308" font-size="16">Host OS</text>
<rect x="420" y="326" width="360" height="50" rx="6" fill="#334155"/><text x="600" y="357" font-size="16">Infrastructure</text>
</g>
<g font-size="13.5" font-weight="700" fill="#c62828" text-anchor="middle">
<text x="600" y="98">container engine被畫成</text>
<text x="600" y="120">夾在app和Host OS中間的一層</text>
</g>
<g stroke="#e53935" stroke-width="7" stroke-linecap="round" opacity="0.9">
<line x1="440" y1="140" x2="760" y2="380"/>
<line x1="760" y1="140" x2="440" y2="380"/>
</g>

<!-- ===== correct container ===== -->
<g font-weight="700" text-anchor="middle" fill="#ffffff">
<rect x="820" y="154" width="84" height="40" rx="6" fill="#6aa84f"/><text x="862" y="180" font-size="15">App 1</text>
<rect x="912" y="154" width="84" height="40" rx="6" fill="#f0a030"/><text x="954" y="180" font-size="15">App 2</text>
<rect x="1004" y="154" width="84" height="40" rx="6" fill="#e0612c"/><text x="1046" y="180" font-size="15">App 3</text>
<rect x="820" y="200" width="84" height="78" rx="6" fill="#8fc078"/><text x="862" y="244" font-size="12.5">Bins / Libs</text>
<rect x="912" y="200" width="84" height="78" rx="6" fill="#f5bd66"/><text x="954" y="244" font-size="12.5">Bins / Libs</text>
<rect x="1004" y="200" width="84" height="78" rx="6" fill="#ec8a5e"/><text x="1046" y="244" font-size="12.5">Bins / Libs</text>
<rect x="1096" y="154" width="84" height="124" rx="6" fill="#2f6bb5"/><text x="1138" y="206" font-size="12.5">container</text><text x="1138" y="223" font-size="12.5">runtime</text><text x="1138" y="240" font-size="10.5" font-weight="600">（containerd）</text>
<rect x="820" y="284" width="360" height="36" rx="6" fill="#64748b"/><text x="1000" y="308" font-size="16">Host OS（共用的kernel）</text>
<rect x="820" y="326" width="360" height="50" rx="6" fill="#334155"/><text x="1000" y="357" font-size="16">Infrastructure</text>
</g>
<g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4">
<line x1="908" y1="150" x2="908" y2="280"/><line x1="1000" y1="150" x2="1000" y2="280"/><line x1="1092" y1="150" x2="1092" y2="280"/>
</g>
<g font-size="13.5" font-weight="700" fill="#2e7d32" text-anchor="middle">
<text x="1000" y="80">沒有Guest OS，也沒有hypervisor：</text>
<text x="1000" y="102">每個container只是Host OS上被隔離的process，</text>
<text x="1000" y="124">runtime在旁邊管理它們，不是夾在中間的一層</text>
</g>
</svg>
