[project]
site_url = "https://megleet.github.io/tech-docs/"
site_name = "Documentation"
# site_description = "Your project description"
# site_author = "Your name"

# copyright = "Copyright &copy; 2026 Your name"

repo_url = "https://github.com/megleet/tech-docs"
repo_name = "megleet/tech-docs"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "K8S Deep Dive" = [
    { "Reference" = "k8s-deep-dive/reference.md" },
    { "Ch-0 History" = "k8s-deep-dive/chap-0-history.md" },
    { "Ch-1 Container基礎：NS / Cgroups" = "k8s-deep-dive/chap-1-container-namespace-cgroups.md" },
    { "Ch-2 Container基礎：FS / Security" = "k8s-deep-dive/chap-2-container-fs-security.md" },
    { "Ch-3 K8s Architecture & Ops" = "k8s-deep-dive/chap-3-kubernetes-architecture-operations.md" },
    { "Ch-4 Orchestration之Pod篇" = "k8s-deep-dive/chap-4-container-orchestration-pod.md" },
    { "Ch-5 Orchestration之Controller篇" = "k8s-deep-dive/chap-5-container-orchestration-controller.md" },
    { "Ch-6 Declarative API" = "k8s-deep-dive/chap-6-declarative-api.md" },
    { "Ch-7 CRD & Operator" = "k8s-deep-dive/chap-7-crd-operator.md" },
    { "Ch-8 Scheduler" = "k8s-deep-dive/chap-8-scheduler.md" },
    { "Ch-9 Storage & Volume" = "k8s-deep-dive/chap-9-volume.md" },
    { "Ch-10 Container Runtime" = "k8s-deep-dive/chap-10-container-runtime.md" },
    { "Ch-11 Network" = "k8s-deep-dive/chap-11-network.md" },
    { "Ch-12 Monitoring & Logging" = "k8s-deep-dive/chap-12-monitoring-logging.md" },
  ] },
  { "Concurrency in Go" = [
    { "Ch-1 Concurrency基礎" = "go-concurrency/chap-1-concurrency-basics.md" },
    { "Ch-2 Goroutine & Runtime" = "go-concurrency/chap-2-goroutine-runtime.md" },
    { "Ch-3 Channel & Select" = "go-concurrency/chap-3-channel-select.md" },
    { "Ch-4 sync pkg：WaitGroup / Mutex" = "go-concurrency/chap-4-sync-pkg.md" },
    { "Ch-5 Concurrency Patterns" = "go-concurrency/chap-5-concurrency-patterns.md" },
  ] },
]

extra_css = [
  "stylesheets/extra.css",
  "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css",
]
extra_javascript = [
  "javascripts/extra.js",
  "javascripts/katex.js",
  "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js",
  "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js",
]

[project.theme]
# variant = "classic"
custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "zh-TW"
features = [
  "announce.dismiss",
  "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
# GitHub-style callouts (> [!NOTE]) so admonitions also render on github.com
github-callouts = {}
md_in_html = {}
toc.permalink = true
# Keep CJK characters in heading anchors so links match GitHub's
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
# Accept 2-space nested lists (the Office Viewer editor saves lists with 2 spaces)
mdx_truly_sane_lists = { nested_indent = 2, truly_sane = false }
