[project]
site_url = "https://megleet.github.io/tech-docs/"
site_name = "Documentation"
# site_description = "Your project description"
# site_author = "Your name"

# copyright = "Copyright &copy; 2026 Your name"

repo_url = "https://github.com/megleet/tech-docs"
repo_name = "megleet/tech-docs"
edit_uri = "edit/main/docs/"

nav = [
  { "Index" = "index.md" },
  { "Tutorials" = [
    { "Get Started" = "tutorials/get-started.md" },
    { "Markdown in 5min" = "tutorials/markdown.md" },
    { "GitHub相容寫法" = "tutorials/github-compatible.md" },
    { "網站排版風格" = "tutorials/style-guide.md" },
    { "Claude Code入口" = "tutorials/claude-code.md" },
  ] },
  { "K8S Deep Dive" = [
    { "Reference" = "k8s-deep-dive/reference.md" },
    { "Chap-0 History" = "k8s-deep-dive/chap-0-history.md" },
    { "Chap-1 Container基礎：Namespace / Cgroups" = "k8s-deep-dive/chap-1-container-namespace-cgroups.md" },
    { "Chap-2 Container基礎：FS / Security" = "k8s-deep-dive/chap-2-container-fs-security.md" },
    { "Chap-3 Kubernetes Architecture & Operations" = "k8s-deep-dive/chap-3-kubernetes-architecture-operations.md" },
    { "Chap-4 Container Orchestration之Pod篇" = "k8s-deep-dive/chap-4-container-orchestration-pod.md" },
    { "Chap-5 Container Orchestration之Controller篇" = "k8s-deep-dive/chap-5-container-orchestration-controller.md" },
    { "Chap-6 Declarative API" = "k8s-deep-dive/chap-6-declarative-api.md" },
    { "Chap-7 CRD & Operator" = "k8s-deep-dive/chap-7-crd-operator.md" },
    { "Chap-8 Volume" = "k8s-deep-dive/chap-8-volume.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "zh-TW"
features = [
  "announce.dismiss",
  "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
# GitHub-style callouts (> [!NOTE]) so admonitions also render on github.com
github-callouts = {}
md_in_html = {}
toc.permalink = true
# Keep CJK characters in heading anchors so links match GitHub's
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
# Accept 2-space nested lists (the Office Viewer editor saves lists with 2 spaces)
mdx_truly_sane_lists = { nested_indent = 2, truly_sane = false }
